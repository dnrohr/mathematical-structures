      type: APPLIED-IN
      strength: theorem
      context: Discrete-time martingales under one of the theorem’s standard sufficient conditions.
    mathematical_skeleton: Stopped martingales have controlled expectations when the stopping time and increments
      prevent mass escaping at infinity.
    scope: Discrete-time martingales under one of the theorem’s standard sufficient conditions.
    assumptions:
      - valid stopping-time condition
      - uniform integrability or boundedness condition
    validity_regime: The stated claim is limited to discrete-time martingales under one of the theorem’s standard
      sufficient conditions.
    caveats:
      - The slogan that fair games remain fair at any stopping time is false without hypotheses.
    counterexamples:
