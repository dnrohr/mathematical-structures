    proposition: Every mixed-strategy Nash equilibrium induces a correlated equilibrium, but correlation permits
      additional joint distributions.
    endpoints:
      from: $candidate
      to: optimization
    proposed_edge:
      type: REPRESENTED-BY
      strength: strong-analogy
      context: Finite strategic games.
    mathematical_skeleton: Obedience inequalities condition each player’s deviation payoff on a private recommendation.
    scope: Finite strategic games.
    assumptions:
      - trusted correlation device
    validity_regime: The stated claim is limited to finite strategic games.
    caveats:
      - A correlated equilibrium is not generally a Nash equilibrium in independent mixed strategies.
    counterexamples:
