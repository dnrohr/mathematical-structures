claims:
  - id: detailed-balance-claim
    proposition: Detailed balance implies stationarity by pairing probability flow across each ordered state pair.
    endpoints:
      from: $candidate
      to: markov-chains
    proposed_edge:
      type: GOVERNS
      strength: theorem
      context: Finite reversible Markov chains.
    mathematical_skeleton: The identities π(x)P(x,y)=π(y)P(y,x) sum to πP=π.
    scope: Finite reversible Markov chains.
    assumptions:
      - nonnegative normalized π
    validity_regime: The stated claim is limited to finite reversible Markov chains.
    caveats:
      - Stationarity does not imply detailed balance for nonreversible chains.
    counterexamples:
      - A directed cycle has a stationary law but violates pairwise reversibility.
    source_assessments:
      - source_id: levin-peres-2017
        proposition: Detailed balance implies stationarity by pairing probability flow across each ordered state pair.
        status: direct-support
        location: Chapter 1, §1.6, pp. 11–13.
        rationale: The pinpointed section defines or develops Detailed balance and the scoped structural claim
          recorded here.
        assessor:
          kind: model-assisted
          identity: atlas-cross-field-evidence-curator
          version: 1.0.0
    possible_falsifiers:
      - "A valid example within the stated scope that violates: Detailed balance implies stationarity by
        pairing probability flow across each ordered state pair."
    alternative_interpretations:
      - A broader use of “Detailed balance” outside the recorded scope.
