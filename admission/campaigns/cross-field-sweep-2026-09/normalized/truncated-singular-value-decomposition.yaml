    proposition: Truncated SVD regularizes inversion by discarding components associated with small singular values.
    endpoints:
      from: $candidate
      to: optimization
    proposed_edge:
      type: IS-A
      strength: special-case
      context: Linear inverse problems with an informative spectral ordering.
    mathematical_skeleton: Only singular components above a selected index or threshold are inverted.
    scope: Linear inverse problems with an informative spectral ordering.
    assumptions:
      - available SVD
      - selected truncation level
    validity_regime: The stated claim is limited to linear inverse problems with an informative spectral ordering.
    caveats:
      - A hard cutoff can introduce artifacts and is expensive at large scale.
    counterexamples:
      - Signal aligned with a discarded singular vector is lost completely.
