  - id: maximum-principle-claim
    proposition: A maximum principle bounds an elliptic or parabolic solution by boundary and forcing data.
    endpoints:
      from: $candidate
      to: stability
    proposed_edge:
      type: GOVERNS
      strength: theorem
      context: Uniformly elliptic or parabolic equations under the stated sign and regularity hypotheses.
    mathematical_skeleton: The differential inequality prevents an interior strict extremum unless the solution is
      suitably degenerate.
    scope: Uniformly elliptic or parabolic equations under the stated sign and regularity hypotheses.
    assumptions:
      - appropriate ellipticity
      - connected domain
    validity_regime: The stated claim is limited to uniformly elliptic or parabolic equations under the stated
      sign and regularity hypotheses.
    caveats:
      - The principle can fail for the wrong zeroth-order sign or nonelliptic operators.
    counterexamples:
      - A reaction term with the wrong sign permits an interior maximum.
