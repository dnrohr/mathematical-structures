claims:
  - id: mixing-time-claim
    proposition: Mixing time quantifies how long a Markov chain takes to approach stationarity in total variation
      distance.
    endpoints:
      from: $candidate
      to: markov-chains
    proposed_edge:
      type: MEASURES-DISTANCE-TO
      strength: theorem
      context: Finite irreducible aperiodic chains.
    mathematical_skeleton: It is the first time after which the worst-start total variation distance falls below a fixed threshold.
    scope: Finite irreducible aperiodic chains.
    assumptions:
      - unique stationary distribution
    validity_regime: The stated claim is limited to finite irreducible aperiodic chains.
    caveats:
      - The numerical value depends on the distance threshold convention.
    counterexamples:
      - A periodic chain need not converge in total variation.
