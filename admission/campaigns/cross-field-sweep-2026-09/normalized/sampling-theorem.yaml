claims:
  - id: sampling-theorem-claim
    proposition: A bandlimited signal is determined by uniformly spaced samples taken above twice its highest frequency.
    endpoints:
      from: $candidate
      to: digital-communications
    proposed_edge:
      type: APPLIED-IN
      strength: theorem
      context: Exactly bandlimited continuous-time signals with ideal uniform sampling.
    mathematical_skeleton: Spectral replicas created by sampling remain disjoint above the Nyquist rate and can be ideally filtered.
    scope: Exactly bandlimited continuous-time signals with ideal uniform sampling.
    assumptions:
      - strict bandlimit
      - sampling clock without jitter
    validity_regime: The stated claim is limited to exactly bandlimited continuous-time signals with ideal uniform sampling.
    caveats:
      - Real signals are rarely exactly bandlimited and ideal reconstruction is noncausal.
    counterexamples:
      - A sinusoid above the Nyquist frequency aliases to a lower sampled frequency.
    source_assessments:
      - source_id: siebert-signals-1986
        proposition: A bandlimited signal is determined by uniformly spaced samples taken above twice its highest
          frequency.
        status: direct-support
        location: Chapter 12, sampling in time and frequency.
        rationale: The pinpointed section defines or develops Sampling theorem and the scoped structural claim
          recorded here.
        assessor:
          kind: model-assisted
          identity: atlas-cross-field-evidence-curator
          version: 1.0.0
    possible_falsifiers:
      - "A valid example within the stated scope that violates: A bandlimited signal is determined by
        uniformly spaced samples taken above twice its highest frequency."
    alternative_interpretations:
      - A broader use of “Sampling theorem” outside the recorded scope.
