claims:
  - id: subgame-perfect-equilibrium-claim
    proposition: A subgame-perfect equilibrium is a Nash equilibrium in every subgame of an extensive-form game.
    endpoints:
      from: $candidate
      to: optimization
    proposed_edge:
      type: REPRESENTED-BY
      strength: special-case
      context: Finite extensive games with proper subgames.
    mathematical_skeleton: Sequential rationality removes noncredible threats by imposing equilibrium after every
      history defining a subgame.
    scope: Finite extensive games with proper subgames.
    assumptions:
      - well-defined continuation games
    validity_regime: The stated claim is limited to finite extensive games with proper subgames.
    caveats:
      - Games of imperfect information can have few or no proper subgames, requiring stronger refinements.
    counterexamples:
      - A Nash profile supported by an incredible off-path threat is not subgame perfect.
