    endpoints:
      from: $candidate
      to: stability
    proposed_edge:
      type: GOVERNS
      strength: strong-analogy
      context: Noisy linear discrete inverse problems.
    mathematical_skeleton: A parameterized approximation filters directions that amplify noise.
    scope: Noisy linear discrete inverse problems.
    assumptions:
      - noise or prior scale
    validity_regime: The stated claim is limited to noisy linear discrete inverse problems.
    caveats:
      - Too much regularization erases real structure and too little amplifies noise.
    counterexamples:
      - Taking the regularization parameter to infinity can collapse the estimate toward a trivial prior.
