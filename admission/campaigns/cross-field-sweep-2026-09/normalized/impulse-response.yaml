claims:
  - id: impulse-response-claim
    proposition: An LTI system impulse response is the Green-function kernel for its input-output operator.
    endpoints:
      from: $candidate
      to: greens-function
    proposed_edge:
      type: FIELD-DIALECT-OF
      strength: identity
      context: Linear time-invariant systems with compatible boundary or initial conventions.
    mathematical_skeleton: Translation invariance makes the response to an input the convolution with the response
      to a unit impulse.
    scope: Linear time-invariant systems with compatible boundary or initial conventions.
    assumptions:
      - linearity
      - time invariance
    validity_regime: The stated claim is limited to linear time-invariant systems with compatible boundary or
      initial conventions.
    caveats:
      - Boundary-dependent Green functions need not be translation invariant.
    counterexamples:
      - A time-varying system requires a two-time kernel rather than a single impulse response.
    source_assessments:
      - source_id: siebert-signals-1986
        proposition: An LTI system impulse response is the Green-function kernel for its input-output operator.
