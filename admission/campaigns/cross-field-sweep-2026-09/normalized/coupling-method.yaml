    proposed_edge:
      type: APPLIED-IN
      strength: theorem
      context: Markov chains admitting a jointly constructed coupling.
    mathematical_skeleton: The coupling inequality bounds total variation by the probability that coupled states differ.
    scope: Markov chains admitting a jointly constructed coupling.
    assumptions:
      - correct marginal transition laws
    validity_regime: The stated claim is limited to markov chains admitting a jointly constructed coupling.
    caveats:
      - A poorly chosen coupling can give a vacuous bound.
