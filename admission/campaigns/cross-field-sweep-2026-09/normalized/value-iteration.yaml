claims:
  - id: value-iteration-claim
    proposition: Value iteration repeatedly applies the Bellman optimality operator to approximate an MDP value function.
    endpoints:
      from: $candidate
      to: markov-chains
    proposed_edge:
      type: APPLIED-IN
      strength: theorem
      context: Finite discounted MDPs.
    mathematical_skeleton: Discounting makes the Bellman operator a contraction with the optimal value as unique fixed point.
    scope: Finite discounted MDPs.
    assumptions:
      - discount factor below one
    validity_regime: The stated claim is limited to finite discounted MDPs.
    caveats:
      - Convergence can be slow when the discount factor is close to one.
    counterexamples:
      - Undiscounted multichain problems need not satisfy the same contraction proof.
    source_assessments:
      - source_id: bertsekas-dp-2017
        proposition: Value iteration repeatedly applies the Bellman optimality operator to approximate an MDP value
          function.
        status: direct-support
        location: Volume I, Chapter 2, §§2.2–2.4.
        rationale: The pinpointed section defines or develops Value iteration and the scoped structural claim recorded
          here.
        assessor:
          kind: model-assisted
          identity: atlas-cross-field-evidence-curator
          version: 1.0.0
