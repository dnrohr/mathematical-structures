claims:
  - id: observability-claim
    proposition: Observability determines whether an initial state is uniquely recoverable from input-output data.
    endpoints:
      from: $candidate
      to: state-space-model
    proposed_edge:
      type: GOVERNS
      strength: theorem
      context: Finite-dimensional continuous-time LTI systems.
    mathematical_skeleton: Full rank of the observability matrix eliminates indistinguishable state directions.
    scope: Finite-dimensional continuous-time LTI systems.
    assumptions:
      - known input
      - noise-free finite observation interval
    validity_regime: The stated claim is limited to finite-dimensional continuous-time LTI systems.
    caveats:
      - Poor observability can make reconstruction numerically fragile before rank is lost.
    counterexamples:
      - Nearly collinear output modes produce an ill-conditioned observability matrix.
