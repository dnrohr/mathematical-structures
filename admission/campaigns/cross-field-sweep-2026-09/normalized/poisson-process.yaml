claims:
  - id: poisson-process-claim
    proposition: A Poisson process models independent events arriving at a constant rate.
    endpoints:
      from: $candidate
      to: epidemic-modeling
    proposed_edge:
      type: APPLIED-IN
      strength: theorem
      context: Homogeneous point processes on the nonnegative time line.
    mathematical_skeleton: Counts have Poisson increments and exponential waiting times with the memoryless property.
    scope: Homogeneous point processes on the nonnegative time line.
    assumptions:
      - constant rate
      - independent increments
    validity_regime: The stated claim is limited to homogeneous point processes on the nonnegative time line.
    caveats:
      - Overdispersion or history dependence violates the homogeneous Poisson model.
    counterexamples:
      - A self-exciting event stream has clustered arrivals rather than independent increments.
    source_assessments:
