claims:
  - id: ill-posed-problem-claim
    proposition: An ill-posed inverse problem lacks existence, uniqueness, or stable dependence on data.
    endpoints:
      from: stability
      to: $candidate
    proposed_edge:
      type: FAILS-WHEN
      strength: special-case
      context: Linear inverse problems in finite discretizations or compact-operator limits.
    mathematical_skeleton: Small singular values or nonclosed range cause small data perturbations to produce
      large solution changes.
    scope: Linear inverse problems in finite discretizations or compact-operator limits.
    assumptions:
      - chosen solution and data norms
    validity_regime: The stated claim is limited to linear inverse problems in finite discretizations or
      compact-operator limits.
    caveats:
      - Finite matrices are formally continuous even when numerically ill-conditioned.
    counterexamples:
      - A well-conditioned orthogonal forward operator defines a well-posed inverse problem.
    source_assessments:
      - source_id: hansen-inverse-2010
