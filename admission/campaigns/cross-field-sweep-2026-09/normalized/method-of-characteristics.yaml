claims:
  - id: method-of-characteristics-claim
    proposition: The method of characteristics converts a first-order PDE into ODEs along characteristic curves.
    endpoints:
      from: $candidate
      to: phase-space
    proposed_edge:
      type: REPRESENTED-BY
      strength: theorem
      context: Smooth first-order transport and Hamilton-Jacobi equations before characteristic crossing.
    mathematical_skeleton: The PDE derivative becomes a directional derivative along a flow in state space.
    scope: Smooth first-order transport and Hamilton-Jacobi equations before characteristic crossing.
    assumptions:
      - sufficiently regular coefficients
      - local characteristic flow
    validity_regime: The stated claim is limited to smooth first-order transport and Hamilton-Jacobi equations
      before characteristic crossing.
    caveats:
      - Characteristics can intersect and destroy classical single-valued solutions.
    counterexamples:
      - Burgers characteristics cross at shock formation.
    source_assessments:
      - source_id: evans-pde-2010
