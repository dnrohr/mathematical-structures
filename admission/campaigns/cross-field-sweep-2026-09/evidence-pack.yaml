    proposition: A weak solution satisfies an integrated PDE identity without requiring all classical derivatives
      to exist.
    endpoints:
      from: $candidate
      to: vector-calculus
    edge:
      type: REPRESENTED-BY
      strength: strong-analogy
      context: Weak formulations of PDEs on domains with specified boundary data.
    mathematical_skeleton: Derivatives are transferred to test functions by integration by parts, producing an integral identity.
    scope: Weak formulations of PDEs on domains with specified boundary data.
    assumptions:
      - locally integrable unknown
      - admissible test functions
    validity_regime: The stated claim is limited to weak formulations of PDEs on domains with specified boundary data.
    caveats:
      - Weak solutions may be nonunique without additional estimates or entropy conditions.
    counterexamples:
