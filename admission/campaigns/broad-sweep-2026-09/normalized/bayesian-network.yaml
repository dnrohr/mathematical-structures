claims:
  - id: bayesian-network-claim
    proposition: A Bayesian network factorizes a joint distribution according to a directed acyclic
      graph and applies Bayes rule for probabilistic inference.
    endpoints:
      from: bayes-rule
      to: $candidate
    proposed_edge:
      type: APPLIED-IN
      strength: theorem
      context: Directed acyclic graphical models with normalized conditional distributions.
    mathematical_skeleton: p(x_1,...,x_n) equals the product over nodes of p(x_i given its parents).
    scope: Discrete or continuous Bayesian networks with well-defined conditional densities.
    assumptions:
      - directed acyclic graph
      - local Markov property
    validity_regime: Distributions Markov with respect to the graph.
    caveats:
      - The graph alone does not imply causal semantics.
    counterexamples:
      - A directed cyclic model is not a Bayesian network under this definition.
    source_assessments:
      - source_id: koller-friedman-2009
        proposition: A Bayesian network factorizes a joint distribution according to a directed acyclic
          graph and applies Bayes rule for probabilistic inference.
        status: direct-support
        location: Bayesian-network representation chapters.
        rationale: The cited textbook location states or develops this proposition; no inference is made
          from topical co-mention alone.
        assessor:
          kind: model-assisted
          identity: structure-atlas-evidence-curator
          version: 1.0.0
    possible_falsifiers:
      - A claimed factorization that cannot normalize or violates the parent ordering.
    alternative_interpretations:
      - Causal Bayesian network with intervention semantics.
