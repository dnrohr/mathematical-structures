claims:
  - id: lyapunov-functions-claim
    proposition: A Lyapunov function certifies stability by decreasing along trajectories while
      measuring displacement from an equilibrium or invariant set.
    endpoints:
      from: $candidate
      to: stability
    proposed_edge:
      type: GOVERNS
      strength: theorem
      context: Positive-definite Lyapunov functions with sign-controlled orbital derivative.
    mathematical_skeleton: V is positive definite and its derivative along the vector field is
      nonpositive for stability, negative definite for asymptotic conclusions under standard
      hypotheses.
    scope: Local nonlinear stability of equilibria and invariant sets.
    assumptions:
      - regular candidate function
      - derivative sign conditions
    validity_regime: The neighborhood where definiteness and derivative conditions hold.
    caveats:
      - Failure to find a Lyapunov function is not proof of instability.
    counterexamples:
      - A positive function increasing along trajectories does not certify stability.
    source_assessments:
      - source_id: khalil-nonlinear-systems-2014
