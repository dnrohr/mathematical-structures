claims:
  - id: orbital-resonance-claim
    proposition: Orbital resonance occurs when fundamental orbital frequencies are near a low-integer
      ratio, producing slow resonant angle dynamics analogous to coupled oscillators.
    endpoints:
      from: $candidate
      to: harmonic-oscillator
    proposed_edge:
      type: SAME-SKELETON
      strength: strong-analogy
      context: Weakly perturbed, near-integrable motion after resonant averaging.
    mathematical_skeleton: A slow integer combination of angles survives averaging and often reduces
      locally to a pendulum-like libration Hamiltonian.
    scope: Mean-motion and related resonances in weakly perturbed celestial systems.
    assumptions:
      - near commensurability
      - perturbative separation of fast and slow angles
    validity_regime: Neighborhood of an isolated resonance where averaging is valid.
    caveats:
      - Frequency commensurability alone does not guarantee libration or capture.
    counterexamples:
      - A near rational ratio with a circulating resonant angle.
    source_assessments:
      - source_id: fitzpatrick-celestial-mechanics-2012
        proposition: Orbital resonance occurs when fundamental orbital frequencies are near a low-integer
          ratio, producing slow resonant angle dynamics analogous to coupled oscillators.
        status: direct-support
        location: Perturbation theory and orbital resonance sections.
        rationale: The cited textbook location states or develops this proposition; no inference is made
          from topical co-mention alone.
        assessor:
          kind: model-assisted
          identity: structure-atlas-evidence-curator
          version: 1.0.0
    possible_falsifiers:
      - No slow resonant angle emerges under the stated averaging regime.
    alternative_interpretations:
      - Secular resonance between precession frequencies.
