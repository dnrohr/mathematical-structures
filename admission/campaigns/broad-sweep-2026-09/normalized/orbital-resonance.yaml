claims:
  - id: orbital-resonance-claim
    proposition: After resonant averaging, the local libration dynamics near a stable isolated orbital
      resonance can be approximated by a pendulum-type Hamiltonian.
    endpoints:
      from: $candidate
      to: harmonic-oscillator
    proposed_edge:
      type: ANALOGOUS-TO
      strength: strong-analogy
      context: Small-amplitude libration about a stable isolated resonance after resonant averaging.
    mathematical_skeleton: A slow integer combination of angles survives averaging and often reduces
      locally to a pendulum-like libration Hamiltonian.
    scope: Weakly perturbed orbit–orbit resonances admitting a one-degree-of-freedom resonant reduction.
    assumptions:
      - near commensurability
      - perturbative separation of fast and slow angles
    validity_regime: Neighborhood of an isolated resonance where averaging is valid.
    caveats:
      - Frequency commensurability alone does not guarantee libration or capture.
    counterexamples:
      - A near rational ratio with a circulating resonant angle.
    source_assessments:
      - source_id: murray-dermott-1999
        proposition: After resonant averaging, the local libration dynamics near a stable isolated orbital
          resonance can be approximated by a pendulum-type Hamiltonian.
        status: direct-support
        location: Chapter 8, §§8.3 and 8.6–8.8, pp. 326–363.
        rationale: The resonant perturbation chapter derives a pendulum model and Hamiltonian description
          for libration near isolated orbit–orbit resonances.
        assessor:
          kind: model-assisted
          identity: structure-atlas-evidence-curator
          version: 1.0.0
    possible_falsifiers:
      - No slow resonant angle emerges under the stated averaging regime.
    alternative_interpretations:
      - Secular resonance between precession frequencies.
