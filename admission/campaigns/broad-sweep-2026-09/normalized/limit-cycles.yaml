claims:
  - id: limit-cycles-claim
    proposition: A limit cycle is an isolated periodic orbit represented as a closed trajectory in phase space.
    endpoints:
      from: $candidate
      to: phase-space
    proposed_edge:
      type: REPRESENTED-BY
      strength: theorem
      context: Autonomous continuous-time systems.
    mathematical_skeleton: A periodic solution traces a closed orbit; isolation distinguishes a limit
      cycle from a family of periodic orbits.
    scope: Finite-dimensional autonomous ODEs.
    assumptions:
      - existence and uniqueness of trajectories
    validity_regime: Periodic solutions of autonomous flows.
    caveats:
      - Closed phase curves in nonautonomous projections need not be limit cycles.
    counterexamples:
      - Every orbit of a linear center is periodic, so none is an isolated limit cycle.
    source_assessments:
      - source_id: khalil-nonlinear-systems-2014
        proposition: A limit cycle is an isolated periodic orbit represented as a closed trajectory in phase
          space.
        status: direct-support
        location: Chapter 2, §2.4, pp. 54–59.
        rationale: Section 2.4 identifies limit cycles as isolated closed orbits and distinguishes them from
          centers.
        assessor:
          kind: model-assisted
          identity: structure-atlas-evidence-curator
          version: 1.0.0
    possible_falsifiers:
      - A claimed cycle lying in a continuum of neighboring periodic orbits.
    alternative_interpretations:
      - Periodic orbit in a discrete map.
