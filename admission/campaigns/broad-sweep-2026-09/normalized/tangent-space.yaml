      context: First derivatives of smooth maps and vector fields at a point.
    mathematical_skeleton: The derivative Df_p is a linear map from T_pM to T_f(p)N.
    scope: Smooth finite-dimensional manifolds.
    assumptions:
      - differentiable map at the base point
    validity_regime: First-order local approximation.
    caveats:
      - A tangent space is not globally identical to the manifold.
    counterexamples:
      - Singular spaces can lack a constant-dimensional manifold tangent bundle.
