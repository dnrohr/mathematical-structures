claims:
  - id: riemannian-metric-claim
    proposition: A Riemannian metric is a smoothly varying positive-definite inner product on tangent
      spaces and therefore assumes a smooth manifold structure.
    endpoints:
      from: $candidate
      to: smoothness
    proposed_edge:
      type: ASSUMES
      strength: theorem
      context: Finite-dimensional smooth manifolds.
    mathematical_skeleton: Each point p has an inner product g_p on T_pM whose coordinate components vary smoothly.
    scope: Positive-definite Riemannian geometry.
    assumptions:
      - smooth manifold
      - positive-definite symmetric tensor field
    validity_regime: Smooth coordinate changes preserving tensorial transformation.
    caveats:
      - Pseudo-Riemannian metrics relax positive definiteness.
    counterexamples:
      - A discontinuously varying inner product is not a smooth Riemannian metric.
    source_assessments:
      - source_id: lee-smooth-manifolds-2012
        proposition: A Riemannian metric is a smoothly varying positive-definite inner product on tangent
          spaces and therefore assumes a smooth manifold structure.
