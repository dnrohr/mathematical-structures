claims:
  - id: hamiltonian-system-claim
    proposition: A Hamiltonian system is naturally represented in phase space by first-order equations
      generated by a Hamiltonian and a symplectic structure.
    endpoints:
      from: $candidate
      to: phase-space
    proposed_edge:
      type: REPRESENTED-BY
      strength: theorem
      context: Canonical or symplectic Hamiltonian mechanics.
    mathematical_skeleton: In canonical coordinates q-dot equals partial H by partial p and p-dot equals
      minus partial H by partial q.
    scope: Finite-dimensional smooth Hamiltonian dynamics.
    assumptions:
      - smooth Hamiltonian
      - nondegenerate symplectic form
    validity_regime: Canonical coordinates locally, symplectic vector fields globally.
    caveats:
      - Dissipative systems are not Hamiltonian without extension or reformulation.
    counterexamples:
      - A generic contracting flow does not preserve symplectic volume.
    source_assessments:
      - source_id: hairer-lubich-wanner-2006
        proposition: A Hamiltonian system is naturally represented in phase space by first-order equations
          generated by a Hamiltonian and a symplectic structure.
        status: direct-support
        location: Hamiltonian systems and symplectic geometry chapters.
        rationale: The cited textbook location states or develops this proposition; no inference is made
          from topical co-mention alone.
        assessor:
          kind: model-assisted
          identity: structure-atlas-evidence-curator
          version: 1.0.0
    possible_falsifiers:
      - Failure of the vector field to satisfy the Hamiltonian contraction equation.
    alternative_interpretations:
      - Time-dependent Hamiltonian in extended phase space.
