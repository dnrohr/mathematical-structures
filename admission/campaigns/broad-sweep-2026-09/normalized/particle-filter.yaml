claims:
  - id: particle-filter-claim
    proposition: When Gaussian filtering assumptions fail, a particle filter replaces a single Gaussian
      belief by a weighted empirical sample propagated and reweighted recursively.
    endpoints:
      from: kalman-filter
      to: $candidate
    proposed_edge:
      type: REPLACED-BY
      strength: strong-analogy
      context: Nonlinear or non-Gaussian state-space models where sequential Monte Carlo is
        computationally feasible.
    mathematical_skeleton: Importance-sample the predictive distribution, weight by likelihood, and
      resample to control weight degeneracy.
    scope: Sequential Bayesian state estimation.
    assumptions:
      - simulable proposal
      - evaluable importance weights
    validity_regime: Monte Carlo consistency as particle count grows under regularity conditions.
    caveats:
      - Finite samples suffer degeneracy and high-dimensional collapse.
    counterexamples:
      - A proposal with zero support where the posterior has mass.
    source_assessments:
      - source_id: thrun-burgard-fox-2005
        proposition: When Gaussian filtering assumptions fail, a particle filter replaces a single Gaussian
          belief by a weighted empirical sample propagated and reweighted recursively.
        status: direct-support
        location: Chapter 4, §4.3, pp. 96–112.
        rationale: The particle filter is presented as sequential Monte Carlo for nonlinear or non-Gaussian
          Bayes filtering.
        assessor:
          kind: model-assisted
          identity: structure-atlas-evidence-curator
          version: 1.0.0
    possible_falsifiers:
      - Importance weights do not target the stated posterior even asymptotically.
    alternative_interpretations:
      - Rao-Blackwellized particle filter.
