    proposition: A B-series is a rooted-tree-indexed formal series expansion used to represent
      Runge-Kutta flows and their compositions.
    endpoints:
      from: $candidate
      to: series-expansion
    proposed_edge:
      type: IS-A
      strength: special-case
      context: Formal expansions for numerical flows of ODEs.
    mathematical_skeleton: Coefficients are indexed by rooted trees whose elementary differentials
      encode derivative compositions.
    scope: Formal local expansions for sufficiently smooth autonomous ODEs.
    assumptions:
      - sufficient derivatives of the vector field
    validity_regime: Formal order analysis and convergent regimes where the series is controlled.
    caveats:
      - Not every geometric integrator is representable by an ordinary B-series.
    counterexamples:
      - Aromatic series require graph structures beyond rooted trees.
