claims:
  - id: convex-function-claim
    proposition: Convex optimization assumes a convex objective and convex feasible structure, making
      every local minimum globally minimizing.
    endpoints:
      from: optimization
      to: $candidate
    proposed_edge:
      type: ASSUMES
      strength: theorem
      context: Convex minimization on a convex feasible set.
    mathematical_skeleton: f(theta x plus one-minus-theta y) is at most theta f(x) plus one-minus-theta f(y).
    scope: Convex minimization problems.
    assumptions:
      - convex domain
      - convex objective
    validity_regime: Local minima considered within the convex feasible set.
    caveats:
      - Strict convexity is needed for uniqueness
      - not for local-to-global optimality.
    counterexamples:
      - A nonconvex double-well has nonglobal local minima.
    source_assessments:
