claims:
  - id: restricted-three-body-problem-claim
    proposition: The circular restricted three-body problem is an autonomous rotating-frame dynamical
      model for a massless body moving under two circularly orbiting primaries.
    endpoints:
      from: $candidate
      to: phase-space
    proposed_edge:
      type: REPRESENTED-BY
      strength: theorem
      context: Rotating position-velocity phase space after normalization.
    mathematical_skeleton: A four-dimensional first-order system combines Coriolis terms with the
      gradient of an effective potential.
    scope: Planar circular restricted problem.
    assumptions:
      - massless third body
      - circular two-body motion of primaries
    validity_regime: Newtonian point-mass gravity in the rotating frame.
    caveats:
      - Spatial, elliptic, relativistic, and finite-mass variants change the model.
    counterexamples:
      - A third body with appreciable mass invalidates the restricted assumption.
    source_assessments:
      - source_id: fitzpatrick-celestial-mechanics-2012
