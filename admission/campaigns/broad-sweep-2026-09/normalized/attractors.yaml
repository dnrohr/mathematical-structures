claims:
  - id: attractors-claim
    proposition: A locally asymptotically stable equilibrium is a local attractor because trajectories
      from a neighborhood converge to it.
    endpoints:
      from: stability
      to: $candidate
    proposed_edge:
      type: GOVERNS
      strength: theorem
      context: Local autonomous dynamics with an invariant set and an attracting neighborhood.
    mathematical_skeleton: Distance to the invariant set tends to zero along trajectories begun in its basin.
    scope: Local equilibrium attractors in finite-dimensional autonomous dynamical systems.
    assumptions:
      - forward completeness in the neighborhood
      - locally asymptotically stable equilibrium
    validity_regime: Initial states in the basin of attraction.
    caveats:
      - An invariant set need not attract, and an attractor need not be a fixed point.
    counterexamples:
      - A Lyapunov-stable center is not attracting.
    source_assessments:
      - source_id: khalil-nonlinear-systems-2014
        proposition: A locally asymptotically stable equilibrium is a local attractor because trajectories
          from a neighborhood converge to it.
        status: direct-support
        location: Chapter 4, §4.1, pp. 112–126; Chapter 8, §8.2, pp. 312–321.
        rationale: The stability and region-of-attraction sections directly support convergence of nearby
          trajectories to a locally asymptotically stable equilibrium.
        assessor:
          kind: model-assisted
          identity: structure-atlas-evidence-curator
          version: 1.0.0
    possible_falsifiers:
      - A nearby trajectory that remains in the basin but fails to approach the set.
    alternative_interpretations:
      - Milnor attractor with a measure-theoretic basin.
