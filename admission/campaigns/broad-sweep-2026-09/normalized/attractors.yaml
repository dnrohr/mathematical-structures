claims:
  - id: attractors-claim
    proposition: An asymptotically stable invariant set is a local attractor because nearby trajectories
      converge to it.
    endpoints:
      from: stability
      to: $candidate
    proposed_edge:
      type: GOVERNS
      strength: theorem
      context: Local autonomous dynamics with an invariant set and an attracting neighborhood.
    mathematical_skeleton: Distance to the invariant set tends to zero along trajectories begun in its basin.
    scope: Local attractors in finite-dimensional autonomous dynamical systems.
    assumptions:
      - forward completeness in the neighborhood
      - invariant candidate set
    validity_regime: Initial states in the basin of attraction.
    caveats:
      - An invariant set need not attract, and an attractor need not be a fixed point.
    counterexamples:
      - A Lyapunov-stable center is not attracting.
    source_assessments:
      - source_id: khalil-nonlinear-systems-2014
        proposition: An asymptotically stable invariant set is a local attractor because nearby trajectories
          converge to it.
        status: direct-support
        location: Stability and invariant-set chapters; attractors and limit sets discussion.
        rationale: The cited textbook location states or develops this proposition; no inference is made
          from topical co-mention alone.
        assessor:
          kind: model-assisted
          identity: structure-atlas-evidence-curator
          version: 1.0.0
    possible_falsifiers:
      - A nearby trajectory that remains in the basin but fails to approach the set.
    alternative_interpretations:
      - Milnor attractor with a measure-theoretic basin.
