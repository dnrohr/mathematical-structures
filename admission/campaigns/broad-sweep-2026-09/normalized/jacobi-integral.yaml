claims:
  - id: jacobi-integral-claim
    proposition: The Jacobi integral is a conserved quantity of the circular restricted three-body
      problem in the uniformly rotating frame.
    endpoints:
      from: $candidate
      to: conservation-laws
    proposed_edge:
      type: IS-A
      strength: special-case
      context: Circular restricted three-body dynamics in rotating coordinates.
    mathematical_skeleton: The rotating-frame equations imply a constant combining effective potential and squared speed.
    scope: Circular restricted three-body problem.
    assumptions:
      - circular primaries
      - uniformly rotating frame
      - massless third body
    validity_regime: Autonomous rotating-frame equations with no added perturbations.
    caveats:
      - It is not the inertial mechanical energy.
    counterexamples:
      - Elliptic primaries generally destroy the time-independent Jacobi constant.
    source_assessments:
      - source_id: fitzpatrick-celestial-mechanics-2012
        proposition: The Jacobi integral is a conserved quantity of the circular restricted three-body
          problem in the uniformly rotating frame.
        status: direct-support
        location: Chapter 8, §8.3, pp. 149–151.
        rationale: The Jacobi integral is derived as a conserved quantity in the rotating restricted
          three-body problem.
        assessor:
          kind: model-assisted
          identity: structure-atlas-evidence-curator
          version: 1.0.0
    possible_falsifiers:
      - Nonzero derivative of the stated integral along an unperturbed solution.
    alternative_interpretations:
      - Jacobi constant with opposite sign convention.
