claims:
  - id: interior-point-method-claim
    proposition: Interior-point methods solve constrained convex optimization by following central
      solutions defined by barrier-perturbed optimality conditions.
    endpoints:
      from: $candidate
      to: optimization
    proposed_edge:
      type: APPLIED-IN
      strength: theorem
      context: Convex programs satisfying the regularity conditions of the chosen primal-dual method.
    mathematical_skeleton: Replace inequality constraints by a barrier or perturbed complementarity
      equations and drive the barrier parameter toward zero.
    scope: Linear, conic, and smooth convex programming.
    assumptions:
      - convexity
      - feasible interior or suitable homogeneous embedding
    validity_regime: Iterates remain in the interior and approach primal-dual optimality.
    caveats:
      - Nonconvex variants lack the same global guarantees.
    counterexamples:
      - An infeasible problem without an embedding has no central path to an optimum.
    source_assessments:
      - source_id: boyd-vandenberghe-2004
        proposition: Interior-point methods solve constrained convex optimization by following central
          solutions defined by barrier-perturbed optimality conditions.
        status: direct-support
        location: Chapter 11, §§11.2–11.7, pp. 563–609.
        rationale: The chapter develops barrier and primal-dual interior-point methods as algorithms applied
          to convex optimization.
        assessor:
          kind: model-assisted
          identity: structure-atlas-evidence-curator
          version: 1.0.0
    possible_falsifiers:
      - Failure of perturbed KKT residuals to approach zero under theorem assumptions.
    alternative_interpretations:
      - Primal versus primal-dual path-following methods.
