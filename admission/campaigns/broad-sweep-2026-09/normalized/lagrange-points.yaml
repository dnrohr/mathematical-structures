claims:
  - id: lagrange-points-claim
    proposition: Lagrange points are equilibrium points of the circular restricted three-body equations
      in the uniformly rotating frame.
    endpoints:
      from: $candidate
      to: phase-space
    proposed_edge:
      type: REPRESENTED-BY
      strength: theorem
      context: Circular restricted three-body problem in rotating position-velocity phase space.
    mathematical_skeleton: Set rotating-frame velocity and acceleration to zero so the effective-force gradient vanishes.
    scope: Five classical equilibrium points L1 through L5.
    assumptions:
      - circular primaries
      - massless third body
      - uniformly rotating frame
    validity_regime: Classical circular restricted model.
    caveats:
      - Only the triangular points are linearly stable for sufficiently small mass ratio; collinear
        points are unstable.
    counterexamples:
      - Adding substantial third-body mass changes the equilibrium problem.
    source_assessments:
      - source_id: fitzpatrick-celestial-mechanics-2012
        proposition: Lagrange points are equilibrium points of the circular restricted three-body equations
          in the uniformly rotating frame.
        status: direct-support
        location: Restricted three-body problem and Lagrange points sections.
        rationale: The cited textbook location states or develops this proposition; no inference is made
          from topical co-mention alone.
        assessor:
          kind: model-assisted
          identity: structure-atlas-evidence-curator
          version: 1.0.0
    possible_falsifiers:
      - A listed point where the rotating effective-force gradient is nonzero.
    alternative_interpretations:
      - Quasi-equilibrium regions in perturbed ephemeris models.
