          identity: structure-atlas-evidence-curator
          version: 1.0.0
    possible_falsifiers:
      - A claimed GraphSLAM formulation lacking a graph-factorized global objective.
    alternative_interpretations:
      - Pose-graph optimization without explicit landmarks.
