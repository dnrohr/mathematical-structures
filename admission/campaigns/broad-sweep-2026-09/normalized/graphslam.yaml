claims:
  - id: graphslam-claim
    proposition: GraphSLAM formulates simultaneous localization and mapping as sparse graph-based
      maximum a posteriori optimization over robot poses and landmarks.
    endpoints:
      from: optimization
      to: $candidate
    proposed_edge:
      type: APPLIED-IN
      strength: theorem
      context: SLAM posterior factorized into motion and measurement constraints.
    mathematical_skeleton: Negative log factors yield a sparse nonlinear least-squares objective whose
      graph records variable-constraint incidence.
    scope: Offline or smoothing-based SLAM with differentiable residual models.
    assumptions:
      - factorized motion and measurement likelihoods
      - chosen gauge or anchor
    validity_regime: MAP estimation under the stated probabilistic model.
    caveats:
      - Nonconvexity
      - data association
      - and gauge freedom can dominate practical behavior.
    counterexamples:
      - An unanchored pose graph has gauge nonuniqueness.
    source_assessments:
      - source_id: thrun-burgard-fox-2005
        proposition: GraphSLAM formulates simultaneous localization and mapping as sparse graph-based
          maximum a posteriori optimization over robot poses and landmarks.
        status: direct-support
