          from topical co-mention alone.
        assessor:
          kind: model-assisted
          identity: structure-atlas-evidence-curator
          version: 1.0.0
    possible_falsifiers:
      - A convex qualified KKT point that is not globally optimal.
    alternative_interpretations:
      - Nonsmooth KKT conditions using subgradients.
