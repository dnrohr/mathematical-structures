claims:
  - id: karush-kuhn-tucker-conditions-claim
    proposition: Under a constraint qualification, KKT conditions are necessary for a constrained local
      optimum and are sufficient for global optimality in a convex problem.
    endpoints:
      from: $candidate
      to: optimization
    proposed_edge:
      type: GOVERNS
      strength: theorem
      context: Differentiable constrained programs; sufficiency additionally uses convexity.
    mathematical_skeleton: Stationarity, primal feasibility, dual feasibility, and complementary slackness.
    scope: Smooth finite-dimensional constrained optimization.
    assumptions:
      - constraint qualification for necessity
      - convexity for sufficiency
    validity_regime: Local necessity generally; global sufficiency in convex programs.
    caveats:
      - Without a qualification, a valid optimum can lack KKT multipliers.
    counterexamples:
      - Degenerate constraints violating all standard qualifications.
    source_assessments:
      - source_id: nocedal-wright-2006
        proposition: Under a constraint qualification, KKT conditions are necessary for a constrained local
          optimum and are sufficient for global optimality in a convex problem.
