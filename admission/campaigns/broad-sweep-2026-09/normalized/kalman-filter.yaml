claims:
  - id: kalman-filter-claim
    proposition: The Kalman update applies Bayes rule as exact Gaussian conditioning inside a
      linear-Gaussian state-space model.
    endpoints:
      from: bayes-rule
      to: linear-gaussian-ssm
    proposed_edge:
      type: APPLIED-IN
      strength: theorem
      context: Gaussian prediction and measurement conditioning in the exact Kalman recursion.
    mathematical_skeleton: Gaussian prediction and conditioning close on the mean and covariance recursions.
    scope: Linear-Gaussian filtering.
    assumptions:
      - linear transition and observation maps
      - Gaussian noises with known covariances
    validity_regime: Exact finite-dimensional Gaussian posterior recursion.
    caveats:
      - Nonlinear or non-Gaussian models require approximations or different representations.
    counterexamples:
      - A multimodal posterior cannot be represented exactly by one mean and covariance.
    source_assessments:
      - source_id: thrun-burgard-fox-2005
        proposition: The Kalman update applies Bayes rule as exact Gaussian conditioning inside a
          linear-Gaussian state-space model.
