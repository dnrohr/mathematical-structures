claims:
  - id: data-processing-inequality-claim
    proposition: Processing data through a Markov channel cannot increase mutual information,
      constraining entropy-derived information measures.
    endpoints:
      from: $candidate
      to: shannon-entropy
    proposed_edge:
      type: GOVERNS
      strength: theorem
      context: Markov chain X to Y to Z under Shannon mutual information.
    mathematical_skeleton: If X-Y-Z is Markov, then I(X;Z) is at most I(X;Y).
    scope: Shannon mutual information for random variables forming a Markov chain.
    assumptions:
      - Markov conditional independence
    validity_regime: Deterministic or stochastic post-processing represented by the channel Y to Z.
    caveats:
      - Equality conditions require additional sufficiency structure.
    counterexamples:
      - Side information not included in the Markov chain can alter the comparison.
    source_assessments:
      - source_id: cover-thomas-2006
        proposition: Processing data through a Markov channel cannot increase mutual information,
          constraining entropy-derived information measures.
        status: direct-support
        location: Entropy, mutual information, and data-processing inequality sections.
        rationale: The cited textbook location states or develops this proposition; no inference is made
          from topical co-mention alone.
        assessor:
          kind: model-assisted
          identity: structure-atlas-evidence-curator
          version: 1.0.0
    possible_falsifiers:
      - A valid Markov chain with I(X;Z) greater than I(X;Y).
    alternative_interpretations:
      - Quantum data-processing inequalities.
