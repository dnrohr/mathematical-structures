claims:
  - id: backward-error-analysis-claim
    proposition: At any fixed truncation order, backward error analysis constructs a nearby modified
      differential equation whose exact flow matches the numerical one-step map up to a controlled
      defect.
    endpoints:
      from: $candidate
      to: smoothness
    proposed_edge:
      type: ASSUMES
      strength: theorem
      context: Truncated modified equations for sufficiently smooth or analytic dynamics.
    mathematical_skeleton: Choose finitely many modified-vector-field coefficients so the truncated
      modified flow matches the numerical one-step map through the claimed order.
    scope: One-step integrators for smooth ODEs.
    assumptions:
      - smooth or analytic vector field
      - sufficiently small step size
    validity_regime: Finite truncation, or exponentially long regimes under analyticity hypotheses.
    caveats:
      - The full modified series commonly diverges and is used asymptotically.
    counterexamples:
      - Nonsmooth dynamics where the required derivatives do not exist.
    source_assessments:
      - source_id: hairer-lubich-wanner-2006
        proposition: At any fixed truncation order, backward error analysis constructs a nearby modified
          differential equation whose exact flow matches the numerical one-step map up to a
          controlled defect.
        status: direct-support
        location: Chapter IX, §§IX.1–IX.3, pp. 337–366.
        rationale: The modified-equation construction is order-by-order and supports the claim only with
          finite-truncation or analytic-regime qualifications.
        assessor:
          kind: model-assisted
          identity: structure-atlas-evidence-curator
          version: 1.0.0
    possible_falsifiers:
      - Failure to match the numerical one-step map through the claimed order.
    alternative_interpretations:
      - Backward error for linear algebra rather than ODE integration.
