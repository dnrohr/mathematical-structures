          from topical co-mention alone.
        assessor:
          kind: model-assisted
          identity: structure-atlas-evidence-curator
          version: 1.0.0
    possible_falsifiers:
      - Group multiplication or inversion fails to be smooth.
    alternative_interpretations:
      - Infinite-dimensional Lie groups.
