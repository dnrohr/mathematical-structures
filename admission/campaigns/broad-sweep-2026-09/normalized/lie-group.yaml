claims:
  - id: lie-group-claim
    proposition: Continuous symmetries are represented by Lie groups whose smooth multiplication
      supports infinitesimal generators in a Lie algebra.
    endpoints:
      from: symmetry
      to: $candidate
    proposed_edge:
      type: REPRESENTED-BY
      strength: theorem
      context: Finite-dimensional continuous transformation groups.
    mathematical_skeleton: A smooth group has a tangent space at the identity with a bracket induced by
      invariant vector fields.
    scope: Finite-dimensional Lie groups and smooth actions.
    assumptions:
      - smooth manifold structure compatible with group operations
    validity_regime: Continuous symmetries described by smooth group actions.
    caveats:
      - Discrete symmetries are groups but not captured by infinitesimal generators.
    counterexamples:
      - A purely finite symmetry group has zero-dimensional local Lie algebra information.
    source_assessments:
      - source_id: lee-smooth-manifolds-2012
