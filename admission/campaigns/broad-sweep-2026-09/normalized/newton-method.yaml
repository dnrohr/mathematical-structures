claims:
  - id: newton-method-claim
    proposition: Newton's optimization method locally solves the stationarity equation by repeatedly
      minimizing the quadratic Taylor model built from the gradient and Hessian.
    endpoints:
      from: $candidate
      to: optimization
    proposed_edge:
      type: APPLIED-IN
      strength: theorem
      context: Smooth unconstrained optimization near a nondegenerate minimizer with suitable
        globalization when needed.
    mathematical_skeleton: Solve Hessian times step equals minus gradient, then update the iterate.
    scope: Twice-differentiable unconstrained minimization.
    assumptions:
      - nonsingular local Hessian
      - Lipschitz-continuous Hessian for standard local rate
    validity_regime: Quadratic local convergence near a solution under standard hypotheses.
    caveats:
      - Far from a minimizer the step may not descend; line search or trust region is commonly
        required.
    counterexamples:
      - An indefinite Hessian can produce an ascent direction.
    source_assessments:
      - source_id: nocedal-wright-2006
        proposition: Newton's optimization method locally solves the stationarity equation by repeatedly
          minimizing the quadratic Taylor model built from the gradient and Hessian.
        status: direct-support
        location: Chapter 3, §§3.3–3.4, pp. 44–48.
        rationale: Newton steps and their local convergence conditions are developed for smooth
          unconstrained optimization.
        assessor:
          kind: model-assisted
          identity: structure-atlas-evidence-curator
          version: 1.0.0
    possible_falsifiers:
      - Loss of the stated quadratic rate despite all local hypotheses.
    alternative_interpretations:
      - Newton's root-finding method applied directly to F(x)=0.
