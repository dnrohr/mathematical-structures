claims:
  - id: symplectic-integrator-claim
    proposition: A symplectic integrator preserves the discrete symplectic form; under backward-error
      hypotheses it nearly conserves a modified Hamiltonian over long time intervals.
    endpoints:
      from: $candidate
      to: hamiltonian-system
    proposed_edge:
      type: APPLIED-IN
      strength: theorem
      context: Symplectic numerical maps for sufficiently smooth Hamiltonian systems; modified-energy
        claims additionally require backward-error hypotheses.
    mathematical_skeleton: The one-step map Phi satisfies pullback of omega equals omega.
    scope: Finite-dimensional Hamiltonian integration.
    assumptions:
      - symplectic phase space
      - symplectic one-step map
    validity_regime: Fixed-step methods under the stated construction.
    caveats:
      - Symplecticity does not imply exact energy conservation at every step.
    counterexamples:
      - Generic adaptive step-size changes can destroy symplecticity.
    source_assessments:
      - source_id: hairer-lubich-wanner-2006
        proposition: A symplectic integrator preserves the discrete symplectic form; under backward-error
          hypotheses it nearly conserves a modified Hamiltonian over long time intervals.
        status: direct-support
        location: Chapter VI, §§VI.3–VI.4, pp. 204–230; Chapter IX, §§IX.1–IX.3, pp. 337–366.
        rationale: The source proves discrete symplectic-form preservation and uses backward error analysis
          to qualify long-time modified-energy behavior.
        assessor:
          kind: model-assisted
          identity: structure-atlas-evidence-curator
          version: 1.0.0
    possible_falsifiers:
      - The numerical map fails the pullback symplectic-form identity.
    alternative_interpretations:
      - Poisson integrator on a degenerate manifold.
