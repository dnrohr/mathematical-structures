claims:
  - id: relative-entropy-claim
    proposition: Relative entropy measures the discrepancy of a distribution P from a reference Q and
      can be written as cross-entropy minus Shannon entropy.
    endpoints:
      from: $candidate
      to: shannon-entropy
    proposed_edge:
      type: REPRESENTED-BY
      strength: theorem
      context: P absolutely continuous with respect to Q; finite alphabets for the elementary formula.
    mathematical_skeleton: D(P parallel Q) equals the expectation under P of log p over q and is nonnegative.
    scope: Classical probability distributions.
    assumptions:
      - P absolutely continuous with respect to Q for finite divergence
    validity_regime: Discrete finite alphabets or measure-theoretic extension with Radon-Nikodym derivative.
    caveats:
      - It is asymmetric and is not a metric.
    counterexamples:
      - If Q assigns zero mass where P is positive, divergence is infinite.
    source_assessments:
      - source_id: cover-thomas-2006
        proposition: Relative entropy measures the discrepancy of a distribution P from a reference Q and
          can be written as cross-entropy minus Shannon entropy.
        status: direct-support
        location: Entropy, relative entropy, and mutual information chapter.
        rationale: The cited textbook location states or develops this proposition; no inference is made
          from topical co-mention alone.
        assessor:
          kind: model-assisted
          identity: structure-atlas-evidence-curator
          version: 1.0.0
    possible_falsifiers:
      - A pair with finite formula yielding negative divergence.
    alternative_interpretations:
      - Quantum relative entropy.
