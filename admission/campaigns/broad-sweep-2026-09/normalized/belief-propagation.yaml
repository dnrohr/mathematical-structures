claims:
  - id: belief-propagation-claim
    proposition: Sum-product belief propagation computes exact marginals on tree-structured factor
      graphs, including chain-structured hidden Markov models.
    endpoints:
      from: hidden-markov-model
      to: $candidate
    proposed_edge:
      type: SOLVED-BY
      strength: theorem
      context: Sum-product messages on a tree; loopy graphs lose the exactness guarantee.
    mathematical_skeleton: Local messages eliminate subtrees and combine by products and marginalizing sums or integrals.
    scope: Tree factor graphs and chain HMMs.
    assumptions:
      - acyclic factor graph
      - finite or integrable factors
    validity_regime: Exact on trees; iterative heuristic on loopy graphs.
    caveats:
      - Loopy belief propagation may fail to converge or return inexact beliefs.
    counterexamples:
      - A frustrated cycle with nonconvergent message updates.
    source_assessments:
      - source_id: koller-friedman-2009
        proposition: Sum-product belief propagation computes exact marginals on tree-structured factor
          graphs, including chain-structured hidden Markov models.
        status: direct-support
        location: Exact inference, clique-tree, and message-passing chapters.
        rationale: The cited textbook location states or develops this proposition; no inference is made
          from topical co-mention alone.
        assessor:
          kind: model-assisted
          identity: structure-atlas-evidence-curator
          version: 1.0.0
    possible_falsifiers:
      - A tree example whose returned belief differs from direct marginalization.
    alternative_interpretations:
      - Max-product messages for MAP rather than marginals.
