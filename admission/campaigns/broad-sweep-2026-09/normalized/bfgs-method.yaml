claims:
  - id: bfgs-method-claim
    proposition: BFGS is a quasi-Newton optimization method that updates an inverse-Hessian
      approximation using gradient differences while preserving positive definiteness under a
      curvature condition.
    endpoints:
      from: $candidate
      to: optimization
    proposed_edge:
      type: APPLIED-IN
      strength: theorem
      context: Smooth unconstrained optimization with a line search satisfying the curvature condition.
    mathematical_skeleton: A rank-two secant update enforces H_{k+1} y_k = s_k and remains positive
      definite when s_k^T y_k is positive.
    scope: Smooth unconstrained minimization.
    assumptions:
      - available gradients
      - positive curvature pair
    validity_regime: Local convergence regimes with suitable line search.
    caveats:
      - Nonconvex curvature can require damping or skipped updates.
    counterexamples:
      - A step with nonpositive s transpose y destroys the standard positivity guarantee.
    source_assessments:
      - source_id: nocedal-wright-2006
        proposition: BFGS is a quasi-Newton optimization method that updates an inverse-Hessian
          approximation using gradient differences while preserving positive definiteness under a
          curvature condition.
        status: direct-support
        location: Quasi-Newton methods chapter; BFGS update and convergence sections.
        rationale: The cited textbook location states or develops this proposition; no inference is made
          from topical co-mention alone.
        assessor:
          kind: model-assisted
          identity: structure-atlas-evidence-curator
          version: 1.0.0
    possible_falsifiers:
      - Violation of the secant equation by the stated update.
    alternative_interpretations:
      - Limited-memory BFGS as a storage variant.
