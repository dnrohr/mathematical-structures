claims:
  - id: factor-graph-claim
    proposition: A factor graph represents a global function or probability distribution as a bipartite
      graph of variables and local factors.
    endpoints:
      from: state-space-model
      to: $candidate
    proposed_edge:
      type: REPRESENTED-BY
      strength: theorem
      context: State-space joint distributions factorized into transition and observation factors.
    mathematical_skeleton: f(x_1,...,x_n) equals a product of factors f_a over subsets of variables
      adjacent to each factor node.
    scope: Finite factorization graphs, including temporal state-space models.
    assumptions:
      - specified factorization
    validity_regime: Exact representation when the product equals the target function.
    caveats:
      - Graph cycles affect inference algorithms but not the validity of the factorization.
    counterexamples:
      - A missing factor that changes the represented joint distribution.
    source_assessments:
      - source_id: koller-friedman-2009
        proposition: A factor graph represents a global function or probability distribution as a bipartite
          graph of variables and local factors.
        status: direct-support
        location: Chapter 4, §4.4.1, pp. 123–127.
        rationale: The factor graph is defined as a bipartite representation of a factorized function,
          supporting classification as an object/representation.
        assessor:
          kind: model-assisted
          identity: structure-atlas-evidence-curator
          version: 1.0.0
    possible_falsifiers:
      - The factor product fails to reconstruct the stated joint distribution.
    alternative_interpretations:
      - Forney-style normal factor graphs.
