claims:
  - id: lagrange-duality-claim
    proposition: Lagrange duality represents a constrained optimization problem by a dual lower-bound
      problem obtained from the infimum of its Lagrangian.
    endpoints:
      from: optimization
      to: $candidate
    proposed_edge:
      type: REPRESENTED-BY
      strength: theorem
      context: Minimization problems with equality and inequality constraints.
    mathematical_skeleton: The dual function g(lambda,nu) is the infimum over x of the Lagrangian and
      never exceeds the primal optimum for dual-feasible multipliers.
    scope: Finite-dimensional constrained optimization.
    assumptions:
      - well-defined Lagrangian
    validity_regime: Weak duality always; strong duality only under added regularity such as Slater
      conditions in convex problems.
    caveats:
      - A duality gap can remain outside strong-duality conditions.
    counterexamples:
      - A nonconvex problem with positive duality gap.
    source_assessments:
      - source_id: boyd-vandenberghe-2004
        proposition: Lagrange duality represents a constrained optimization problem by a dual lower-bound
          problem obtained from the infimum of its Lagrangian.
        status: direct-support
        location: Chapter 5, §§5.1–5.3, pp. 215–244.
        rationale: The Lagrangian, dual function, dual problem, and weak/strong duality are developed
          explicitly.
        assessor:
          kind: model-assisted
          identity: structure-atlas-evidence-curator
          version: 1.0.0
    possible_falsifiers:
      - A dual-feasible value exceeding the primal optimum in a minimization problem.
    alternative_interpretations:
      - Fenchel duality.
