claims:
  - id: variational-integrator-claim
    proposition: A variational integrator discretizes the action principle and derives the time-step map
      from discrete Euler-Lagrange equations.
    endpoints:
      from: $candidate
      to: variational-principles
    proposed_edge:
      type: ASSUMES
      strength: theorem
      context: Discrete Lagrangians approximating an action integral.
    mathematical_skeleton: Stationarity of the discrete action sum yields a symplectic update and
      discrete momentum results under symmetry.
    scope: Lagrangian mechanical systems with a regular discrete Lagrangian.
    assumptions:
      - discrete action principle
      - regularity of the discrete Lagrangian
    validity_regime: Fixed-step discrete mechanics under the chosen quadrature approximation.
    caveats:
      - Not every symplectic integrator is presented or implemented variationally.
    counterexamples:
      - A generic update not derivable from any regular discrete action.
    source_assessments:
      - source_id: hairer-lubich-wanner-2006
