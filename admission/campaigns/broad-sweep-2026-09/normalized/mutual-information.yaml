claims:
  - id: mutual-information-claim
    proposition: Mutual information is an entropy-derived measure of statistical dependence equal to the
      relative entropy between the joint law and the product of marginals.
    endpoints:
      from: $candidate
      to: shannon-entropy
    proposed_edge:
      type: REPRESENTED-BY
      strength: theorem
      context: Discrete variables
    mathematical_skeleton: I(X;Y) equals H(X) plus H(Y) minus H(X,Y), and equals D(pXY parallel pX pY).
    scope: Shannon information theory.
    assumptions:
      - well-defined entropies or relative entropy
    validity_regime: Finite discrete alphabets without extra measure-theoretic qualifications.
    caveats:
      - Differential-entropy terms may be coordinate-dependent even when mutual information is
        invariant.
    counterexamples:
      - Zero covariance does not imply zero mutual information outside Gaussian families.
    source_assessments:
      - source_id: cover-thomas-2006
        proposition: Mutual information is an entropy-derived measure of statistical dependence equal to the
          relative entropy between the joint law and the product of marginals.
        status: direct-support
        location: Entropy and mutual information chapter.
        rationale: The cited textbook location states or develops this proposition; no inference is made
          from topical co-mention alone.
        assessor:
          kind: model-assisted
          identity: structure-atlas-evidence-curator
          version: 1.0.0
    possible_falsifiers:
      - A dependent finite distribution with zero KL divergence from the product law.
    alternative_interpretations:
      - Conditional mutual information.
