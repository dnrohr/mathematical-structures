claims:
  - id: cotangent-bundle-claim
    proposition: The cotangent bundle T*Q supplies the canonical phase space for unconstrained
      Hamiltonian mechanics on a configuration manifold Q.
    endpoints:
      from: $candidate
      to: phase-space
    proposed_edge:
      type: SAME-SKELETON
      strength: strong-analogy
      context: Canonical Hamiltonian systems without constraint reduction.
    mathematical_skeleton: Points are pairs (q,p) with p a covector at q, carrying the canonical symplectic two-form.
    scope: Finite-dimensional canonical Hamiltonian mechanics.
    assumptions:
      - smooth configuration manifold
      - unconstrained canonical formulation
    validity_regime: Before constraint reduction or noncanonical coordinate changes.
    caveats:
      - General symplectic phase spaces need not be global cotangent bundles.
    counterexamples:
      - A reduced coadjoint orbit can be symplectic without being T*Q globally.
    source_assessments:
      - source_id: lee-smooth-manifolds-2012
        proposition: The cotangent bundle T*Q supplies the canonical phase space for unconstrained
          Hamiltonian mechanics on a configuration manifold Q.
        status: direct-support
        location: Cotangent bundle and differential-form chapters.
        rationale: The cited textbook location states or develops this proposition; no inference is made
          from topical co-mention alone.
        assessor:
          kind: model-assisted
          identity: structure-atlas-evidence-curator
          version: 1.0.0
    possible_falsifiers:
      - Failure of covector fibers or the canonical one-form construction.
    alternative_interpretations:
      - Phase space as a general symplectic manifold.
