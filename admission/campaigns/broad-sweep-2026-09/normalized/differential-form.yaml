claims:
  - id: differential-form-claim
    proposition: Differential forms provide the coordinate-independent representation that unifies
      gradient, circulation, flux, and integral theorems from vector calculus.
    endpoints:
      from: vector-calculus
      to: $candidate
    proposed_edge:
      type: REPRESENTED-BY
      strength: theorem
      context: Smooth oriented manifolds, specializing in dimensions two and three.
    mathematical_skeleton: The exterior derivative and pullback combine with Stokes theorem integral
      over boundary equals integral of the derivative.
    scope: Smooth manifolds and classical vector calculus under metric-dependent identifications.
    assumptions:
      - smoothness
      - orientation where integration requires it
    validity_regime: Differential forms of compatible degree on manifolds with boundary.
    caveats:
      - Gradient and curl identifications use a metric and orientation in addition to forms.
    counterexamples:
      - Nonorientable manifolds require densities or twisted forms for global integration.
    source_assessments:
      - source_id: lee-smooth-manifolds-2012
        proposition: Differential forms provide the coordinate-independent representation that unifies
          gradient, circulation, flux, and integral theorems from vector calculus.
