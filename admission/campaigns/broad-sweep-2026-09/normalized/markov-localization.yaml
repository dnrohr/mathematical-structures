claims:
  - id: markov-localization-claim
    proposition: Markov localization performs recursive Bayes filtering over robot pose using motion and
      sensor models.
    endpoints:
      from: bayes-rule
      to: $candidate
    proposed_edge:
      type: APPLIED-IN
      strength: theorem
      context: Discrete or continuous pose-state Bayes filters with Markov motion and observation models.
    mathematical_skeleton: Alternate prediction by the transition kernel with correction by the observation likelihood.
    scope: Robot localization in a known map.
    assumptions:
      - Markov state
      - conditionally independent current observation given state
    validity_regime: Correctly specified motion and measurement models.
    caveats:
      - Representation may be grid, particles, or parametric and changes approximation behavior.
    counterexamples:
      - Long-lived unmodeled state violates the Markov pose model.
    source_assessments:
      - source_id: thrun-burgard-fox-2005
        proposition: Markov localization performs recursive Bayes filtering over robot pose using motion and
          sensor models.
        status: direct-support
        location: Chapter 7, §§7.2–7.3, pp. 197–211.
        rationale: Markov localization is presented as recursive Bayes filtering over robot pose.
        assessor:
          kind: model-assisted
          identity: structure-atlas-evidence-curator
          version: 1.0.0
    possible_falsifiers:
      - An update not decomposable into predict and measurement-correction steps.
    alternative_interpretations:
      - Topological localization rather than metric pose estimation.
