claims:
  - id: occupancy-grid-mapping-claim
    proposition: Occupancy-grid mapping applies Bayesian updates to cell occupancy variables using
      inverse sensor evidence under a simplifying cell-independence approximation.
    endpoints:
      from: bayes-rule
      to: $candidate
    proposed_edge:
      type: APPLIED-IN
      strength: strong-analogy
      context: Static maps with grid cells and an inverse sensor model.
    mathematical_skeleton: Per-cell log odds accumulate prior-adjusted measurement log-likelihood ratios.
    scope: Static two-dimensional or three-dimensional occupancy grids.
    assumptions:
      - static environment
      - approximate conditional independence of cells
    validity_regime: Mapping with known or separately estimated robot poses.
    caveats:
      - Cell independence is computationally useful but generally false in the full posterior.
    counterexamples:
      - Strongly correlated occlusion structure violates independent cell updates.
    source_assessments:
      - source_id: thrun-burgard-fox-2005
        proposition: Occupancy-grid mapping applies Bayesian updates to cell occupancy variables using
          inverse sensor evidence under a simplifying cell-independence approximation.
        status: direct-support
        location: Occupancy grid mapping chapter.
        rationale: The cited textbook location states or develops this proposition; no inference is made
          from topical co-mention alone.
        assessor:
          kind: model-assisted
          identity: structure-atlas-evidence-curator
          version: 1.0.0
    possible_falsifiers:
      - An update rule that cannot be derived from odds-form Bayesian evidence accumulation.
    alternative_interpretations:
      - Forward-model occupancy mapping without inverse sensor factorization.
