claims:
  - id: smooth-manifold-claim
    proposition: A smooth manifold is a locally Euclidean topological space equipped with smoothly
      compatible coordinate charts.
    endpoints:
      from: $candidate
      to: smoothness
    proposed_edge:
      type: ASSUMES
      strength: theorem
      context: Finite-dimensional Hausdorff second-countable manifolds.
    mathematical_skeleton: Transition maps between overlapping charts are smooth maps between open
      subsets of Euclidean space.
    scope: Finite-dimensional smooth manifolds without boundary unless stated.
    assumptions:
      - Hausdorff topology
      - second countability
      - smooth atlas
    validity_regime: Coordinate-independent differential calculus.
    caveats:
      - Topological manifolds need not admit a unique smooth structure.
    counterexamples:
      - A chart collection with nonsmooth transition maps defines no smooth atlas.
    source_assessments:
      - source_id: lee-smooth-manifolds-2012
        proposition: A smooth manifold is a locally Euclidean topological space equipped with smoothly
          compatible coordinate charts.
        status: direct-support
        location: Smooth manifolds and smooth maps chapters.
        rationale: The cited textbook location states or develops this proposition; no inference is made
          from topical co-mention alone.
        assessor:
          kind: model-assisted
          identity: structure-atlas-evidence-curator
          version: 1.0.0
    possible_falsifiers:
      - An overlap map failing the required differentiability class.
    alternative_interpretations:
      - Manifold with boundary or corners.
