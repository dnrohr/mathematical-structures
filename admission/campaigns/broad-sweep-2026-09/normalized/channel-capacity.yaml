claims:
  - id: channel-capacity-claim
    proposition: Channel capacity is the supremum of reliably achievable communication rates and governs
      the asymptotic rate limit for digital communication over a specified channel model.
    endpoints:
      from: $candidate
      to: digital-communications
    proposed_edge:
      type: GOVERNS
      strength: theorem
      context: Asymptotically long codes under the channel model and error criterion of the coding theorem.
    mathematical_skeleton: For a memoryless channel C equals the maximum over input laws of mutual information I(X;Y).
    scope: Discrete memoryless channels, with model-specific extensions.
    assumptions:
      - fixed channel law
      - arbitrarily long block codes
    validity_regime: Rates below capacity are achievable; rates above are ruled out by a converse.
    caveats:
      - Finite-blocklength and mismatch constraints change practical limits.
    counterexamples:
      - A rate above C with vanishing error would contradict the converse.
    source_assessments:
      - source_id: cover-thomas-2006
        proposition: Channel capacity is the supremum of reliably achievable communication rates and governs
          the asymptotic rate limit for digital communication over a specified channel model.
        status: direct-support
        location: Channel capacity and channel coding theorem chapters.
        rationale: The cited textbook location states or develops this proposition; no inference is made
          from topical co-mention alone.
        assessor:
          kind: model-assisted
          identity: structure-atlas-evidence-curator
          version: 1.0.0
    possible_falsifiers:
      - A valid coding sequence above capacity with vanishing error under the same model.
    alternative_interpretations:
      - Operational capacity under cost or feedback constraints.
