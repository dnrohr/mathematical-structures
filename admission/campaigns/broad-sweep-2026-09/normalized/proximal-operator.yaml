claims:
  - id: proximal-operator-claim
    proposition: The proximal operator converts a possibly nonsmooth convex function into a regularized
      minimization subproblem used by first-order optimization algorithms.
    endpoints:
      from: $candidate
      to: optimization
    proposed_edge:
      type: APPLIED-IN
      strength: theorem
      context: Proper closed convex functions and positive proximal parameter.
    mathematical_skeleton: prox of f at v is the argmin over x of f(x) plus one over twice lambda times
      squared distance to v.
    scope: Convex composite optimization.
    assumptions:
      - proper lower-semicontinuous convex function
    validity_regime: Euclidean proximal map; generalized metrics require adjusted statements.
    caveats:
      - The proximal subproblem may itself be expensive or set-valued outside standard convex
        assumptions.
    counterexamples:
      - A nonconvex function with multiple proximal minimizers.
    source_assessments:
      - source_id: parikh-boyd-2014
        proposition: The proximal operator converts a possibly nonsmooth convex function into a regularized
          minimization subproblem used by first-order optimization algorithms.
        status: direct-support
        location: Section 1.1, pp. 124–126, equations (1.1)–(1.3).
        rationale: The proximal operator is defined as a strongly convex minimization subproblem and related
          to projection.
        assessor:
          kind: model-assisted
          identity: structure-atlas-evidence-curator
          version: 1.0.0
    possible_falsifiers:
      - Failure of the minimization definition to produce the claimed update.
    alternative_interpretations:
      - Resolvent of a maximal monotone operator.
