claims:
  - id: extended-kalman-filter-claim
    proposition: When nonlinear dynamics or observations break the linear Kalman assumptions, the
      extended Kalman filter replaces exact propagation with Jacobian linearization.
    endpoints:
      from: kalman-filter
      to: $candidate
    proposed_edge:
      type: REPLACED-BY
      strength: strong-analogy
      context: Differentiable nonlinear state-space models with approximately Gaussian local uncertainty.
    mathematical_skeleton: Propagate mean through nonlinear maps and covariance through their Jacobians,
      then apply a Kalman-form correction.
    scope: Differentiable nonlinear filtering with unimodal local uncertainty.
    assumptions:
      - differentiable models
      - useful first-order approximation
    validity_regime: Small uncertainty and weak local nonlinearity.
    caveats:
      - The recursion is approximate and can be inconsistent or diverge.
    counterexamples:
      - Strongly multimodal posteriors not captured by one Gaussian.
    source_assessments:
      - source_id: thrun-burgard-fox-2005
        proposition: When nonlinear dynamics or observations break the linear Kalman assumptions, the
          extended Kalman filter replaces exact propagation with Jacobian linearization.
        status: direct-support
        location: Gaussian filters and extended Kalman filter chapter.
        rationale: The cited textbook location states or develops this proposition; no inference is made
          from topical co-mention alone.
        assessor:
          kind: model-assisted
          identity: structure-atlas-evidence-curator
          version: 1.0.0
    possible_falsifiers:
      - An implementation that does not use local Jacobians or equivalent linearization.
    alternative_interpretations:
      - Iterated EKF measurement updates.
