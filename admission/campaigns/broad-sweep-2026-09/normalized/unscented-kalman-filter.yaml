claims:
  - id: unscented-kalman-filter-claim
    proposition: When nonlinear maps break exact Kalman propagation, the unscented Kalman filter
      replaces linearization by deterministic sigma points chosen to reproduce moments.
    endpoints:
      from: kalman-filter
      to: $candidate
    proposed_edge:
      type: REPLACED-BY
      strength: strong-analogy
      context: Nonlinear state-space models with approximately Gaussian beliefs.
    mathematical_skeleton: Transform weighted sigma points through the nonlinear map and reconstruct
      approximate mean and covariance.
    scope: Nonlinear Gaussian filtering.
    assumptions:
      - finite moments
      - useful Gaussian moment approximation
    validity_regime: Unimodal uncertainty where low-order moments summarize the belief adequately.
    caveats:
      - The posterior remains approximated as Gaussian and parameter choices affect numerical
        behavior.
    counterexamples:
      - Strong multimodality not representable by reconstructed mean and covariance.
    source_assessments:
      - source_id: thrun-burgard-fox-2005
        proposition: When nonlinear maps break exact Kalman propagation, the unscented Kalman filter
          replaces linearization by deterministic sigma points chosen to reproduce moments.
        status: direct-support
        location: Chapter 3, §3.4, pp. 65–70.
        rationale: The unscented transform and resulting Gaussian-filter recursion are developed explicitly.
        assessor:
          kind: model-assisted
          identity: structure-atlas-evidence-curator
          version: 1.0.0
    possible_falsifiers:
      - Sigma points fail to reproduce the prescribed prior moments.
    alternative_interpretations:
      - Cubature Kalman filters with different point rules.
