evidence_schema: 1.0.0
campaign_id: broad-sweep-2026-09
assessor: structure-atlas-evidence-curator
entries:
  - candidate_id: attractors
    proposition: An asymptotically stable invariant set is a local attractor because nearby trajectories converge to it.
    endpoints: { from: stability, to: $candidate }
    edge: { type: GOVERNS, strength: theorem, context: Local autonomous dynamics with an invariant set and an attracting neighborhood. }
    mathematical_skeleton: Distance to the invariant set tends to zero along trajectories begun in its basin.
    scope: Local attractors in finite-dimensional autonomous dynamical systems.
    assumptions: [forward completeness in the neighborhood, invariant candidate set]
    validity_regime: Initial states in the basin of attraction.
    caveats: ["An invariant set need not attract, and an attractor need not be a fixed point."]
    counterexamples: [A Lyapunov-stable center is not attracting.]
    source_id: khalil-nonlinear-systems-2014
    source_location: Stability and invariant-set chapters; attractors and limit sets discussion.
    possible_falsifiers: [A nearby trajectory that remains in the basin but fails to approach the set.]
    alternative_interpretations: [Milnor attractor with a measure-theoretic basin.]
    search_query: Khalil Nonlinear Systems attractor asymptotic stability invariant set
    challenge: The term attractor has inequivalent topological and measure-theoretic definitions.
    response: The claim is restricted to the local asymptotically stable invariant-set definition.
    recommended_action: Retain the scoped node and record broader definitions as caveats.

  - candidate_id: limit-cycles
    proposition: A limit cycle is an isolated periodic orbit represented as a closed trajectory in phase space.
    endpoints: { from: $candidate, to: phase-space }
    edge: { type: REPRESENTED-BY, strength: theorem, context: Autonomous continuous-time systems. }
    mathematical_skeleton: A periodic solution traces a closed orbit; isolation distinguishes a limit cycle from a family of periodic orbits.
    scope: Finite-dimensional autonomous ODEs.
    assumptions: [existence and uniqueness of trajectories]
    validity_regime: Periodic solutions of autonomous flows.
    caveats: [Closed phase curves in nonautonomous projections need not be limit cycles.]
    counterexamples: ["Every orbit of a linear center is periodic, so none is an isolated limit cycle."]
    source_id: khalil-nonlinear-systems-2014
    source_location: Phase-plane analysis and limit-cycle sections.
    possible_falsifiers: [A claimed cycle lying in a continuum of neighboring periodic orbits.]
    alternative_interpretations: [Periodic orbit in a discrete map.]
    search_query: Khalil Nonlinear Systems limit cycle isolated periodic orbit
    challenge: A closed curve alone does not establish a limit cycle.
    response: Isolation and autonomous-flow assumptions are explicit in the proposition.
    recommended_action: Retain with the isolation condition prominent.

  - candidate_id: b-series
    proposition: A B-series is a rooted-tree-indexed formal series expansion used to represent Runge-Kutta flows and their compositions.
    endpoints: { from: $candidate, to: series-expansion }
    edge: { type: IS-A, strength: special-case, context: Formal expansions for numerical flows of ODEs. }
    mathematical_skeleton: Coefficients are indexed by rooted trees whose elementary differentials encode derivative compositions.
    scope: Formal local expansions for sufficiently smooth autonomous ODEs.
    assumptions: [sufficient derivatives of the vector field]
    validity_regime: Formal order analysis and convergent regimes where the series is controlled.
    caveats: [Not every geometric integrator is representable by an ordinary B-series.]
    counterexamples: [Aromatic series require graph structures beyond rooted trees.]
    source_id: hairer-lubich-wanner-2006
    source_location: B-series and order-condition sections.
    possible_falsifiers: [A purported B-series coefficient requiring a non-rooted-tree invariant.]
    alternative_interpretations: [Exact-flow versus numerical-method B-series.]
    search_query: Hairer Lubich Wanner B-series rooted trees Runge-Kutta
    challenge: The label can refer to a formal algebra, a method expansion, or the exact flow.
    response: The node encompasses the rooted-tree formalism and distinguishes those uses in scope notes.
    recommended_action: Retain as a specialized series-expansion object.

  - candidate_id: backward-error-analysis
    proposition: Backward error analysis interprets a numerical trajectory as the exact trajectory of a nearby modified differential equation.
    endpoints: { from: $candidate, to: smoothness }
    edge: { type: ASSUMES, strength: theorem, context: Truncated modified equations for sufficiently smooth or analytic dynamics. }
    mathematical_skeleton: Choose modified vector-field coefficients so its exact flow matches the numerical one step map order by order.
    scope: One-step integrators for smooth ODEs.
    assumptions: [smooth or analytic vector field, sufficiently small step size]
    validity_regime: Finite truncation, or exponentially long regimes under analyticity hypotheses.
    caveats: [The full modified series commonly diverges and is used asymptotically.]
    counterexamples: [Nonsmooth dynamics where the required derivatives do not exist.]
    source_id: hairer-lubich-wanner-2006
    source_location: Backward error analysis and modified equations chapters.
    possible_falsifiers: [Failure to match the numerical one-step map through the claimed order.]
    alternative_interpretations: [Backward error for linear algebra rather than ODE integration.]
    search_query: Hairer Lubich Wanner backward error analysis modified differential equation
    challenge: Calling the numerical solution exact may hide truncation and divergence.
    response: The claim says nearby truncated modified equation and states the asymptotic limitation.
    recommended_action: Retain with the truncation caveat.

  - candidate_id: bayesian-network
    proposition: A Bayesian network factorizes a joint distribution according to a directed acyclic graph and applies Bayes rule for probabilistic inference.
    endpoints: { from: bayes-rule, to: $candidate }
    edge: { type: APPLIED-IN, strength: theorem, context: Directed acyclic graphical models with normalized conditional distributions. }
    mathematical_skeleton: p(x_1,...,x_n) equals the product over nodes of p(x_i given its parents).
    scope: Discrete or continuous Bayesian networks with well-defined conditional densities.
    assumptions: [directed acyclic graph, local Markov property]
    validity_regime: Distributions Markov with respect to the graph.
    caveats: [The graph alone does not imply causal semantics.]
    counterexamples: [A directed cyclic model is not a Bayesian network under this definition.]
    source_id: koller-friedman-2009
    source_location: Bayesian-network representation chapters.
    possible_falsifiers: [A claimed factorization that cannot normalize or violates the parent ordering.]
    alternative_interpretations: [Causal Bayesian network with intervention semantics.]
    search_query: Koller Friedman Bayesian network DAG factorization
    challenge: Directed edges are often misread as causal claims.
    response: The proposition is purely probabilistic; causality is an additional interpretation.
    recommended_action: Retain as a model node with an explicit noncausal default.

  - candidate_id: belief-propagation
    proposition: Sum-product belief propagation computes exact marginals on tree-structured factor graphs, including chain-structured hidden Markov models.
    endpoints: { from: hidden-markov-model, to: $candidate }
    edge: { type: SOLVED-BY, strength: theorem, context: Sum-product messages on a tree; loopy graphs lose the exactness guarantee. }
    mathematical_skeleton: Local messages eliminate subtrees and combine by products and marginalizing sums or integrals.
    scope: Tree factor graphs and chain HMMs.
    assumptions: [acyclic factor graph, finite or integrable factors]
    validity_regime: Exact on trees; iterative heuristic on loopy graphs.
    caveats: [Loopy belief propagation may fail to converge or return inexact beliefs.]
    counterexamples: [A frustrated cycle with nonconvergent message updates.]
    source_id: koller-friedman-2009
    source_location: Exact inference, clique-tree, and message-passing chapters.
    possible_falsifiers: [A tree example whose returned belief differs from direct marginalization.]
    alternative_interpretations: [Max-product messages for MAP rather than marginals.]
    search_query: Koller Friedman belief propagation exact tree marginals
    challenge: The common loopy algorithm does not inherit tree exactness.
    response: Exactness is explicitly limited to trees, with loopy use marked heuristic.
    recommended_action: Retain and encode tree versus loopy regimes.

  - candidate_id: bfgs-method
    proposition: BFGS is a quasi-Newton optimization method that updates an inverse-Hessian approximation using gradient differences while preserving positive definiteness under a curvature condition.
    endpoints: { from: $candidate, to: optimization }
    edge: { type: APPLIED-IN, strength: theorem, context: Smooth unconstrained optimization with a line search satisfying the curvature condition. }
    mathematical_skeleton: A rank-two secant update enforces H_{k+1} y_k = s_k and remains positive definite when s_k^T y_k is positive.
    scope: Smooth unconstrained minimization.
    assumptions: [available gradients, positive curvature pair]
    validity_regime: Local convergence regimes with suitable line search.
    caveats: [Nonconvex curvature can require damping or skipped updates.]
    counterexamples: [A step with nonpositive s transpose y destroys the standard positivity guarantee.]
    source_id: nocedal-wright-2006
    source_location: Quasi-Newton methods chapter; BFGS update and convergence sections.
    possible_falsifiers: [Violation of the secant equation by the stated update.]
    alternative_interpretations: [Limited-memory BFGS as a storage variant.]
    search_query: Nocedal Wright BFGS secant positive definite curvature condition
    challenge: BFGS is not simply Newton's method without an exact Hessian.
    response: The claim identifies its distinct secant update and conditional positivity result.
    recommended_action: Retain as an operation distinct from Newton's method.

  - candidate_id: channel-capacity
    proposition: Channel capacity is the supremum of reliably achievable communication rates and governs the asymptotic rate limit for digital communication over a specified channel model.
    endpoints: { from: $candidate, to: digital-communications }
    edge: { type: GOVERNS, strength: theorem, context: Asymptotically long codes under the channel model and error criterion of the coding theorem. }
    mathematical_skeleton: For a memoryless channel C equals the maximum over input laws of mutual information I(X;Y).
    scope: Discrete memoryless channels, with model-specific extensions.
    assumptions: [fixed channel law, arbitrarily long block codes]
    validity_regime: Rates below capacity are achievable; rates above are ruled out by a converse.
    caveats: [Finite-blocklength and mismatch constraints change practical limits.]
    counterexamples: [A rate above C with vanishing error would contradict the converse.]
    source_id: cover-thomas-2006
    source_location: Channel capacity and channel coding theorem chapters.
    possible_falsifiers: [A valid coding sequence above capacity with vanishing error under the same model.]
    alternative_interpretations: [Operational capacity under cost or feedback constraints.]
    search_query: Cover Thomas channel capacity coding theorem mutual information
    challenge: Capacity is model-dependent, not a property of hardware alone.
    response: The channel law and asymptotic coding regime are explicit.
    recommended_action: Retain with model and finite-blocklength caveats.

  - candidate_id: convex-function
    proposition: Convex optimization assumes a convex objective and convex feasible structure, making every local minimum globally minimizing.
    endpoints: { from: optimization, to: $candidate }
    edge: { type: ASSUMES, strength: theorem, context: Convex minimization on a convex feasible set. }
    mathematical_skeleton: f(theta x plus one-minus-theta y) is at most theta f(x) plus one-minus-theta f(y).
    scope: Convex minimization problems.
    assumptions: [convex domain, convex objective]
    validity_regime: Local minima considered within the convex feasible set.
    caveats: ["Strict convexity is needed for uniqueness, not for local-to-global optimality."]
    counterexamples: [A nonconvex double-well has nonglobal local minima.]
    source_id: boyd-vandenberghe-2004
    source_location: Convex functions and convex optimization problem chapters.
    possible_falsifiers: [A convex problem possessing a strict nonglobal local minimum.]
    alternative_interpretations: [Geodesic convexity on manifolds.]
    search_query: Boyd Vandenberghe convex function local minimum global
    challenge: The term is sometimes attached to a function while constraints remain nonconvex.
    response: The proposition requires both convex objective and feasible structure.
    recommended_action: Retain with the complete problem assumptions.

  - candidate_id: convex-set
    proposition: A convex optimization feasible region assumes closure under line segments between feasible points.
    endpoints: { from: optimization, to: $candidate }
    edge: { type: ASSUMES, strength: theorem, context: Feasible sets in convex optimization. }
    mathematical_skeleton: For x and y in C and theta in [0,1], theta x plus one-minus-theta y remains in C.
    scope: Euclidean convex optimization.
    assumptions: [affine ambient space]
    validity_regime: Ordinary linear interpolation in the chosen coordinates.
    caveats: [A coordinate change need not preserve Euclidean convexity.]
    counterexamples: [A disconnected feasible set is nonconvex.]
    source_id: boyd-vandenberghe-2004
    source_location: Convex sets chapter.
    possible_falsifiers: [Two feasible points whose connecting segment leaves the set.]
    alternative_interpretations: [Geodesically convex sets.]
    search_query: Boyd Vandenberghe convex set line segment definition
    challenge: Convexity depends on the affine representation.
    response: The ambient affine coordinates are part of the scope.
    recommended_action: Retain as an object node linked to optimization assumptions.

  - candidate_id: cotangent-bundle
    proposition: The cotangent bundle T*Q supplies the canonical phase space for unconstrained Hamiltonian mechanics on a configuration manifold Q.
    endpoints: { from: $candidate, to: phase-space }
    edge: { type: SAME-SKELETON, strength: strong-analogy, context: Canonical Hamiltonian systems without constraint reduction. }
    mathematical_skeleton: Points are pairs (q,p) with p a covector at q, carrying the canonical symplectic two-form.
    scope: Finite-dimensional canonical Hamiltonian mechanics.
    assumptions: [smooth configuration manifold, unconstrained canonical formulation]
    validity_regime: Before constraint reduction or noncanonical coordinate changes.
    caveats: [General symplectic phase spaces need not be global cotangent bundles.]
    counterexamples: [A reduced coadjoint orbit can be symplectic without being T*Q globally.]
    source_id: lee-smooth-manifolds-2012
    source_location: Cotangent bundle and differential-form chapters.
    possible_falsifiers: [Failure of covector fibers or the canonical one-form construction.]
    alternative_interpretations: [Phase space as a general symplectic manifold.]
    search_query: Lee smooth manifolds cotangent bundle canonical phase space
    challenge: Equating every phase space with a cotangent bundle is too strong.
    response: The scope is the canonical unconstrained formulation and states the exception.
    recommended_action: Retain with a scoped SAME-SKELETON edge.

  - candidate_id: data-processing-inequality
    proposition: Processing data through a Markov channel cannot increase mutual information, constraining entropy-derived information measures.
    endpoints: { from: $candidate, to: shannon-entropy }
    edge: { type: GOVERNS, strength: theorem, context: Markov chain X to Y to Z under Shannon mutual information. }
    mathematical_skeleton: If X-Y-Z is Markov, then I(X;Z) is at most I(X;Y).
    scope: Shannon mutual information for random variables forming a Markov chain.
    assumptions: [Markov conditional independence]
    validity_regime: Deterministic or stochastic post-processing represented by the channel Y to Z.
    caveats: [Equality conditions require additional sufficiency structure.]
    counterexamples: [Side information not included in the Markov chain can alter the comparison.]
    source_id: cover-thomas-2006
    source_location: Entropy, mutual information, and data-processing inequality sections.
    possible_falsifiers: [A valid Markov chain with I(X;Z) greater than I(X;Y).]
    alternative_interpretations: [Quantum data-processing inequalities.]
    search_query: Cover Thomas data processing inequality Markov chain mutual information
    challenge: The theorem is about mutual information, not entropy monotonically decreasing in every process.
    response: The proposition names mutual information and the Markov condition explicitly.
    recommended_action: Retain as a theorem with no generic entropy-monotonicity claim.

  - candidate_id: differential-form
    proposition: Differential forms provide the coordinate-independent representation that unifies gradient, circulation, flux, and integral theorems from vector calculus.
    endpoints: { from: vector-calculus, to: $candidate }
    edge: { type: REPRESENTED-BY, strength: theorem, context: "Smooth oriented manifolds, specializing in dimensions two and three." }
    mathematical_skeleton: The exterior derivative and pullback combine with Stokes theorem integral over boundary equals integral of the derivative.
    scope: Smooth manifolds and classical vector calculus under metric-dependent identifications.
    assumptions: [smoothness, orientation where integration requires it]
    validity_regime: Differential forms of compatible degree on manifolds with boundary.
    caveats: [Gradient and curl identifications use a metric and orientation in addition to forms.]
    counterexamples: [Nonorientable manifolds require densities or twisted forms for global integration.]
    source_id: lee-smooth-manifolds-2012
    source_location: Differential forms, integration, and Stokes theorem chapters.
    possible_falsifiers: [A claimed vector-calculus identity incompatible with exterior differentiation.]
    alternative_interpretations: [Distributional differential forms.]
    search_query: Lee smooth manifolds differential forms Stokes vector calculus
    challenge: Saying forms are identical to vector calculus hides metric-dependent conversions.
    response: The claim says representation and explicitly separates metric identifications.
    recommended_action: Retain with the metric caveat.

  - candidate_id: extended-kalman-filter
    proposition: When nonlinear dynamics or observations break the linear Kalman assumptions, the extended Kalman filter replaces exact propagation with Jacobian linearization.
    endpoints: { from: kalman-filter, to: $candidate }
    edge: { type: REPLACED-BY, strength: strong-analogy, context: Differentiable nonlinear state-space models with approximately Gaussian local uncertainty. }
    mathematical_skeleton: Propagate mean through nonlinear maps and covariance through their Jacobians, then apply a Kalman-form correction.
    scope: Differentiable nonlinear filtering with unimodal local uncertainty.
    assumptions: [differentiable models, useful first-order approximation]
    validity_regime: Small uncertainty and weak local nonlinearity.
    caveats: [The recursion is approximate and can be inconsistent or diverge.]
    counterexamples: [Strongly multimodal posteriors not captured by one Gaussian.]
    source_id: thrun-burgard-fox-2005
    source_location: Gaussian filters and extended Kalman filter chapter.
    possible_falsifiers: [An implementation that does not use local Jacobians or equivalent linearization.]
    alternative_interpretations: [Iterated EKF measurement updates.]
    search_query: Probabilistic Robotics extended Kalman filter Jacobian nonlinear
    challenge: The EKF is often incorrectly described as an exact nonlinear Kalman filter.
    response: Approximation, locality, and failure modes are explicit.
    recommended_action: Retain as a replacement operation, not an exact specialization.

  - candidate_id: factor-graph
    proposition: A factor graph represents a global function or probability distribution as a bipartite graph of variables and local factors.
    endpoints: { from: state-space-model, to: $candidate }
    edge: { type: REPRESENTED-BY, strength: theorem, context: State-space joint distributions factorized into transition and observation factors. }
    mathematical_skeleton: f(x_1,...,x_n) equals a product of factors f_a over subsets of variables adjacent to each factor node.
    scope: Finite factorization graphs, including temporal state-space models.
    assumptions: [specified factorization]
    validity_regime: Exact representation when the product equals the target function.
    caveats: [Graph cycles affect inference algorithms but not the validity of the factorization.]
    counterexamples: [A missing factor that changes the represented joint distribution.]
    source_id: koller-friedman-2009
    source_location: Factorized representations and message-passing chapters.
    possible_falsifiers: [The factor product fails to reconstruct the stated joint distribution.]
    alternative_interpretations: [Forney-style normal factor graphs.]
    search_query: Koller Friedman factor graph variables factors product
    challenge: A factor graph is a representation, not an inference algorithm.
    response: The claim confines the node to representation and leaves message passing separate.
    recommended_action: Retain as an object/representation node.

  - candidate_id: graphslam
    proposition: GraphSLAM formulates simultaneous localization and mapping as sparse graph-based maximum a posteriori optimization over robot poses and landmarks.
    endpoints: { from: optimization, to: $candidate }
    edge: { type: APPLIED-IN, strength: theorem, context: SLAM posterior factorized into motion and measurement constraints. }
    mathematical_skeleton: Negative log factors yield a sparse nonlinear least-squares objective whose graph records variable-constraint incidence.
    scope: Offline or smoothing-based SLAM with differentiable residual models.
    assumptions: [factorized motion and measurement likelihoods, chosen gauge or anchor]
    validity_regime: MAP estimation under the stated probabilistic model.
    caveats: ["Nonconvexity, data association, and gauge freedom can dominate practical behavior."]
    counterexamples: [An unanchored pose graph has gauge nonuniqueness.]
    source_id: thrun-burgard-fox-2005
    source_location: GraphSLAM chapter and full-SLAM inference sections.
    possible_falsifiers: [A claimed GraphSLAM formulation lacking a graph-factorized global objective.]
    alternative_interpretations: [Pose-graph optimization without explicit landmarks.]
    search_query: Probabilistic Robotics GraphSLAM graph optimization poses landmarks
    challenge: GraphSLAM is not merely any SLAM implementation using a graph data structure.
    response: The definition requires a factorized global MAP objective and sparse graph structure.
    recommended_action: Retain as a named optimization operation.

  - candidate_id: hamiltonian-system
    proposition: A Hamiltonian system is naturally represented in phase space by first-order equations generated by a Hamiltonian and a symplectic structure.
    endpoints: { from: $candidate, to: phase-space }
    edge: { type: REPRESENTED-BY, strength: theorem, context: Canonical or symplectic Hamiltonian mechanics. }
    mathematical_skeleton: In canonical coordinates q-dot equals partial H by partial p and p-dot equals minus partial H by partial q.
    scope: Finite-dimensional smooth Hamiltonian dynamics.
    assumptions: [smooth Hamiltonian, nondegenerate symplectic form]
    validity_regime: Canonical coordinates locally, symplectic vector fields globally.
    caveats: [Dissipative systems are not Hamiltonian without extension or reformulation.]
    counterexamples: [A generic contracting flow does not preserve symplectic volume.]
    source_id: hairer-lubich-wanner-2006
    source_location: Hamiltonian systems and symplectic geometry chapters.
    possible_falsifiers: [Failure of the vector field to satisfy the Hamiltonian contraction equation.]
    alternative_interpretations: [Time-dependent Hamiltonian in extended phase space.]
    search_query: Hairer Lubich Wanner Hamiltonian system phase space symplectic
    challenge: Merely conserving an energy-like scalar does not make a system Hamiltonian.
    response: The definition requires the symplectic generation relation, not conservation alone.
    recommended_action: Retain with the symplectic condition.

  - candidate_id: interior-point-method
    proposition: Interior-point methods solve constrained convex optimization by following central solutions defined by barrier-perturbed optimality conditions.
    endpoints: { from: optimization, to: $candidate }
    edge: { type: SOLVED-BY, strength: theorem, context: Convex programs satisfying the regularity conditions of the chosen primal-dual method. }
    mathematical_skeleton: Replace inequality constraints by a barrier or perturbed complementarity equations and drive the barrier parameter toward zero.
    scope: Linear, conic, and smooth convex programming.
    assumptions: [convexity, feasible interior or suitable homogeneous embedding]
    validity_regime: Iterates remain in the interior and approach primal-dual optimality.
    caveats: [Nonconvex variants lack the same global guarantees.]
    counterexamples: [An infeasible problem without an embedding has no central path to an optimum.]
    source_id: boyd-vandenberghe-2004
    source_location: Interior-point methods chapter.
    possible_falsifiers: [Failure of perturbed KKT residuals to approach zero under theorem assumptions.]
    alternative_interpretations: [Primal versus primal-dual path-following methods.]
    search_query: Boyd Vandenberghe interior point central path barrier KKT
    challenge: Interior-point is a family, not one update rule.
    response: The node is defined by central-path/barrier structure and records variants beneath it.
    recommended_action: Retain as an operation family.

  - candidate_id: jacobi-integral
    proposition: The Jacobi integral is a conserved quantity of the circular restricted three-body problem in the uniformly rotating frame.
    endpoints: { from: $candidate, to: conservation-laws }
    edge: { type: IS-A, strength: special-case, context: Circular restricted three-body dynamics in rotating coordinates. }
    mathematical_skeleton: The rotating-frame equations imply a constant combining effective potential and squared speed.
    scope: Circular restricted three-body problem.
    assumptions: [circular primaries, uniformly rotating frame, massless third body]
    validity_regime: Autonomous rotating-frame equations with no added perturbations.
    caveats: [It is not the inertial mechanical energy.]
    counterexamples: [Elliptic primaries generally destroy the time-independent Jacobi constant.]
    source_id: fitzpatrick-celestial-mechanics-2012
    source_location: Restricted three-body problem, Jacobi integral, and zero-velocity surface sections.
    possible_falsifiers: [Nonzero derivative of the stated integral along an unperturbed solution.]
    alternative_interpretations: [Jacobi constant with opposite sign convention.]
    search_query: Fitzpatrick celestial mechanics Jacobi integral restricted three body rotating
    challenge: Calling it energy can obscure rotating-frame and sign conventions.
    response: The claim uses conserved quantity and identifies the precise model.
    recommended_action: Retain as a special conservation-law object.

  - candidate_id: kalman-filter
    proposition: The Kalman update applies Bayes rule as exact Gaussian conditioning inside a linear-Gaussian state-space model.
    endpoints: { from: bayes-rule, to: linear-gaussian-ssm }
    edge: { type: APPLIED-IN, strength: theorem, context: Gaussian prediction and measurement conditioning in the exact Kalman recursion. }
    mathematical_skeleton: Gaussian prediction and conditioning close on the mean and covariance recursions.
    scope: Linear-Gaussian filtering.
    assumptions: [linear transition and observation maps, Gaussian noises with known covariances]
    validity_regime: Exact finite-dimensional Gaussian posterior recursion.
    caveats: [Nonlinear or non-Gaussian models require approximations or different representations.]
    counterexamples: [A multimodal posterior cannot be represented exactly by one mean and covariance.]
    source_id: thrun-burgard-fox-2005
    source_location: Gaussian filters and Kalman filter sections.
    possible_falsifiers: [A linear-Gaussian example where the recursion differs from direct Gaussian conditioning.]
    alternative_interpretations: [Information-form Kalman filtering.]
    search_query: Probabilistic Robotics Kalman filter exact linear Gaussian
    challenge: The algorithm is often conflated with the state-space model it solves.
    response: The edge direction explicitly separates model from solver.
    recommended_action: Merge the evidence into the existing trusted node.

  - candidate_id: karush-kuhn-tucker-conditions
    proposition: Under a constraint qualification, KKT conditions are necessary for a constrained local optimum and are sufficient for global optimality in a convex problem.
    endpoints: { from: $candidate, to: optimization }
    edge: { type: GOVERNS, strength: theorem, context: Differentiable constrained programs; sufficiency additionally uses convexity. }
    mathematical_skeleton: Stationarity, primal feasibility, dual feasibility, and complementary slackness.
    scope: Smooth finite-dimensional constrained optimization.
    assumptions: [constraint qualification for necessity, convexity for sufficiency]
    validity_regime: Local necessity generally; global sufficiency in convex programs.
    caveats: ["Without a qualification, a valid optimum can lack KKT multipliers."]
    counterexamples: [Degenerate constraints violating all standard qualifications.]
    source_id: nocedal-wright-2006
    source_location: Optimality conditions and constraint qualifications chapters.
    possible_falsifiers: [A convex qualified KKT point that is not globally optimal.]
    alternative_interpretations: [Nonsmooth KKT conditions using subgradients.]
    search_query: Nocedal Wright KKT necessary sufficient constraint qualification convex
    challenge: KKT is routinely stated without the hypotheses separating necessity from sufficiency.
    response: Both constraint qualification and convexity roles are explicit.
    recommended_action: Retain as a theorem node with split regimes.

  - candidate_id: lagrange-duality
    proposition: Lagrange duality represents a constrained optimization problem by a dual lower-bound problem obtained from the infimum of its Lagrangian.
    endpoints: { from: optimization, to: $candidate }
    edge: { type: REPRESENTED-BY, strength: theorem, context: Minimization problems with equality and inequality constraints. }
    mathematical_skeleton: The dual function g(lambda,nu) is the infimum over x of the Lagrangian and never exceeds the primal optimum for dual-feasible multipliers.
    scope: Finite-dimensional constrained optimization.
    assumptions: [well-defined Lagrangian]
    validity_regime: Weak duality always; strong duality only under added regularity such as Slater conditions in convex problems.
    caveats: [A duality gap can remain outside strong-duality conditions.]
    counterexamples: [A nonconvex problem with positive duality gap.]
    source_id: boyd-vandenberghe-2004
    source_location: Lagrange duality and optimality conditions chapters.
    possible_falsifiers: [A dual-feasible value exceeding the primal optimum in a minimization problem.]
    alternative_interpretations: [Fenchel duality.]
    search_query: Boyd Vandenberghe Lagrange dual function weak strong duality
    challenge: Strong duality is not automatic from writing a Lagrangian.
    response: The claim separates unconditional weak duality from qualified strong duality.
    recommended_action: Retain with the duality-gap caveat.

  - candidate_id: lagrange-points
    proposition: Lagrange points are equilibrium points of the circular restricted three-body equations in the uniformly rotating frame.
