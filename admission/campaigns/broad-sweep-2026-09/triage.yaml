  - disposition: propose-node
    proposed_node_type: principle
    rationale: Cross-cutting structural constraint or quantitative principle rather than a single algorithm.
    candidate_ids:
      - channel-capacity
      - entropy-rate
      - input-to-state-stability
      - lagrange-duality
      - lyapunov-functions
      - passivity
      - rate-distortion-theory
      - robust-optimization

  - disposition: propose-node
    proposed_node_type: theorem
    rationale: Named result or criterion whose usefulness depends on explicit hypotheses.
    candidate_ids:
      - asymptotic-equipartition-property
      - data-processing-inequality
      - d-separation
      - fano-inequality
      - kam-theory
      - karush-kuhn-tucker-conditions
      - lasalle-invariance-principle
      - sard-theorem
      - small-gain-theorem

  - disposition: propose-node
    proposed_node_type: phenomenon
    rationale: Recurring dynamical behavior that appears across more than one model family.
    candidate_ids:
      - attractors
      - limit-cycles
      - orbital-resonance
      - secular-perturbation-theory
      - singular-perturbation
      - tidal-evolution

  - disposition: propose-node
    proposed_node_type: move
    rationale: Reusable reasoning or discretization move that exposes or preserves mathematical structure.
    candidate_ids:
      - backward-error-analysis
      - semidefinite-relaxation
      - symplectic-integrator
      - variational-integrator

  - disposition: merge-or-refine
    target_slug: kalman-filter
    rationale: Exact canonical-name match; the two-source dossier should refine the trusted Kalman-filter node.
    candidate_ids: [kalman-filter]

  - disposition: add-alias
    target_slug: conservation-laws
    rationale: In dynamics, a first integral is the conserved-quantity formulation of a conservation law; review scope before alias admission.
    candidate_ids: [first-integral]

  - disposition: propose-edge
    rationale: The harvested term primarily names a relation, so review it as graph structure rather than forcing a standalone node.
    candidate_ids:
      - conditional-independence
      - spin-orbit-coupling

  - disposition: retain-example
    rationale: Concrete model or regime useful as an example under a broader node, but too narrow for the first promotion wave.
    candidate_ids:
      - central-force-motion
      - gaussian-channel
      - highly-oscillatory-system
      - keplerian-orbit
      - zero-velocity-surface

  - disposition: propose-application
    proposed_node_type: application
    rationale: Domain workflow whose value is showing where structural methods are materially used.
    candidate_ids:
      - structure-learning

  - disposition: deliberate-non-edge
    rationale: Lexical proximity invites a misleading graph connection that should be explicitly tested and refused.
    candidate_ids:
      - causal-graph
      - geometric-programming

  - disposition: reject
    rationale: The harvested label is too polysemous or generic to identify a reviewable atlas entity without a narrower source-local definition.
    candidate_ids:
      - composition-method
      - embedding
      - flow
      - sensor-model

  - disposition: defer
    rationale: Legitimate topic, but lower cross-field leverage or insufficiently scoped for the first evidence budget.
    candidate_ids:
      - conic-programming
      - eccentric-anomaly
      - equilibrium-points
      - immersion
      - lagrangian-mechanics
      - mean-anomaly
      - multistep-method
      - network-information-theory
      - nonlinear-observers
      - phase-portraits
      - probabilistic-motion-model
      - quadratic-programming
      - reversible-integrator
      - rotating-reference-frame
      - submersion

