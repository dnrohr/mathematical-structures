    proposition: Principal component analysis changes to orthogonal covariance eigenvector coordinates ordered by explained variance.
    endpoints: { from: principal-components, to: change-of-representation }
    proposed_edge:
      type: IS-A
      strength: special-case
      context: Classical linear PCA for a centered finite-variance data matrix or covariance operator.
    mathematical_skeleton: Diagonalize the covariance matrix and project observations onto its ordered orthonormal eigenvectors.
    scope: Classical linear PCA.
    assumptions: [finite second moments, a chosen centering and scaling convention]
    validity_regime: Exact for the sample covariance construction; usefulness as dimension reduction depends on variance being meaningful.
    caveats: [Components need not be causally meaningful., Scaling changes the result.]
    counterexamples: [Nonlinear manifolds poorly represented by a linear subspace.]
    source_assessments:
      - source_id: jolliffe-2002
        proposition: Classical PCA finds orthogonal linear combinations ordered by variance through covariance eigendecomposition.
