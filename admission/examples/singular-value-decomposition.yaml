claims:
  - id: svd-is-representation-change
    proposition: SVD is a change of representation that diagonalizes a linear map between two possibly different inner-product spaces.
    endpoints: { from: singular-value-decomposition, to: change-of-representation }
    proposed_edge:
      type: IS-A
      strength: theorem
      context: Finite-dimensional real or complex inner-product spaces; the left and right singular-vector bases may differ.
    mathematical_skeleton: A = U Sigma V*, with orthonormal domain and codomain bases and nonnegative diagonal singular values.
    scope: Finite-dimensional linear maps represented by rectangular or square matrices.
    assumptions: [finite dimension, compatible real or complex inner products]
    validity_regime: Exact factorization; numerical algorithms introduce ordinary floating-point error.
    caveats: [It is not generally an eigendecomposition of A., Degenerate singular subspaces do not select unique vectors.]
    counterexamples: [A nonsquare matrix has no eigendecomposition of the same form.]
    source_assessments:
      - source_id: golub-van-loan-2013
        proposition: Every matrix admits A = U Sigma V* with unitary or orthogonal U and V.
        status: direct-support
        location: Chapter 2.4, singular value decomposition theorem and discussion
        assessor: { kind: human, identity: atlas-pilot-curator, version: '1' }
    possible_falsifiers: [A finite matrix for which no unitary/orthogonal singular-vector bases exist.]
    alternative_interpretations: [Retain SVD as an extended example on eigenvalues rather than a standalone node.]
  - id: svd-applied-in-imaging
    proposition: SVD materially supports analysis and regularization of discrete inverse problems in computational imaging.
    endpoints: { from: singular-value-decomposition, to: computational-imaging }
    proposed_edge:
      type: APPLIED-IN
      strength: theorem
      context: Linearized discrete inverse problems; truncated SVD and filter factors diagnose and regularize ill-conditioning.
    mathematical_skeleton: Singular components separate data-informed directions from small-singular-value directions that amplify noise.
    scope: Discretized linear inverse problems, including representative imaging operators.
    assumptions: [linear or linearized forward operator, specified noise/error model]
    validity_regime: Diagnostic and regularization role, not a claim that every imaging method explicitly computes a full SVD.
    caveats: [Large-scale solvers often use iterative partial decompositions., Nonlinear inverse problems need additional machinery.]
    counterexamples: [A nonlinear forward model with no useful local linearization.]
    source_assessments:
      - source_id: hansen-2010
        proposition: Singular systems and filter factors characterize ill-posed discrete inverse problems and truncated-SVD regularization.
        status: direct-support
        location: Chapters 2-4, especially the SVD analysis and TSVD sections
        assessor: { kind: human, identity: atlas-pilot-curator, version: '1' }
    possible_falsifiers: [Evidence that singular-component analysis has no material role in the stated linear inverse-problem regime.]
    alternative_interpretations: [Represent only a canonical example under change-of-representation.]
