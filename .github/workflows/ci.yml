name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run check
      # M3: build the full site and run the Playwright smoke suite
      # (spec §11 journeys) against the built dist/.
      - run: npm run build
      # M6: the JS budget (≤ 200 KB gzipped, excluding data) is enforced,
      # not aspirational.
      - run: npm run budget
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
