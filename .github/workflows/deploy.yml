name: Deploy

# Build the full site (data artifacts + app) and deploy dist/ to GitHub
# Pages on every push to main (ARCHITECTURE.md §7). The deployed footer
# shows `generated_from`, so every page has provenance to its content
# commit. First run requires Pages to be enabled for the repository
# (Settings → Pages → Source: GitHub Actions); configure-pages attempts
# the enablement itself.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
