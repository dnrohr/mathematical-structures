    space boundary of the stability answer, and crossing it is
    reorganization rather than explosion.
  evidence: [strogatz-1994]

- from: bifurcation
  to: feedback-control
  type: APPLIED-IN
  strength: strong-analogy
  context: >-
    Oscillation onset in a closed loop — gain or delay pushed past its
    margin — is a Hopf bifurcation: a complex pair crossing the boundary
    births the limit cycle whose amplitude describing-function analysis
    estimates.
  notes: >-
    Theorem-grade for smooth ODE loop models satisfying the Hopf
    hypotheses (transversal crossing, nonzero first Lyapunov coefficient);
    as a claim about physical control loops it stays an established
    analogy.
  evidence: [guckenheimer-holmes-1983, astrom-murray-2008]

- from: linearization
  to: biological-regulation
  type: APPLIED-IN
  strength: strong-analogy
  context: >-
    Steady states of regulatory ODE models are classified by the Jacobian
    at the operating point — the small-signal move in biological dress —
    and delay-induced oscillation onset is read from the linearized
    characteristic equation.
  notes: >-
    Strong-analogy like this cluster's MIGRATED-TO edges: routine within
    quantitative systems biology, and the model-to-organism step carries
    the usual caveats.
  evidence: [del-vecchio-murray-2015]

- from: stability
  to: biological-regulation
  type: APPLIED-IN
  strength: strong-analogy
  context: >-
    Stability of regulatory steady states is the workhorse question of
    quantitative models — which fixed points of a network model attract,
    and how robustly — asked with exactly the map's spectral and Lyapunov
    machinery.
  evidence: [del-vecchio-murray-2015, alon-2006]

- from: bifurcation
  to: biological-regulation
  type: APPLIED-IN
  strength: strong-analogy
  context: >-
    Bistable switches (the toggle) are saddle-node/pitchfork events,
    oscillation onset in delayed or repressive loops is the Hopf story in
    biological dress, and developmental switching is routinely modeled as
    a bifurcation crossed by a slowly varying signal.
  evidence: [del-vecchio-murray-2015, alon-2006]

- from: symmetry
  to: change-of-representation
  type: SYMMETRY-SELECTS-REPRESENTATION
  strength: theorem
  context: >-
    The pattern in its general form: the problem's invariance group
    selects the coordinates in which it block-diagonalizes — translation
    picks Fourier modes, rotation picks spherical harmonics, commuting
    operators share eigenspaces — with representation theory as the
    machinery. The typed Fourier and eigenvalue edges are this edge
    specialized.
  evidence: [hamermesh-1962]

- from: chaos
  to: phase-space
  type: REPRESENTED-BY
  strength: theorem
  context: >-
    Chaos is a phase-space phenomenon: stretch-and-fold geometry, strange
    attractors, and the erasure of initial-condition information are
    defined on the portrait, and boundedness-plus-stretching is read
    there, not from any time series alone.
  evidence: [strogatz-1994]

- from: eigenvalues
  to: chaos
  type: GOVERNS
  strength: strong-analogy
  context: >-
    The Lyapunov spectrum governs sensitive dependence — a positive
    leading exponent is the quantitative definition of chaos — and the
    exponents are eigenvalue-like growth rates of the tangent flow, made
    well-defined by Oseledets' multiplicative ergodic theorem.
  notes: >-
    The upgrade is the content: eigenvalues of frozen Jacobians along a
    trajectory do not in general give Lyapunov exponents, and reasoning
    from pointwise spectra to global behavior is the standard trap — hence
    strong-analogy rather than theorem for the eigenvalue reading.
  evidence: [eckmann-ruelle-1985]

- from: chaos
  to: thermodynamic-entropy
  type: ANALOGOUS-TO
  strength: heuristic-analogy
  context: >-
    Mixing supplies the mechanism in dynamical accounts of macroscopic
    irreversibility: what stretching-and-folding disperses over the energy
    shell, coarse-graining then discards, and the entropy balance records
    the loss.
  notes: >-
    A program-level correspondence, not a theorem about real many-body
    systems: Kolmogorov–Sinai entropy is a rate of information production
    about initial conditions, not the thermodynamic state function, and
    the transfer runs through ergodic theory rather than the shared word.
  evidence: [dorfman-1999]

- from: renormalization
  to: chaos
  type: APPLIED-IN
  strength: theorem
  context: >-
    Feigenbaum universality: the period-doubling cascade's constants α and
    δ are eigenvalue data of the doubling operator's fixed point —
    renormalization run in function space — which is why quantitatively
    different unimodal maps share the same exponents.
  notes: >-
    Established rigorously for unimodal maps (computer-assisted and later
    conceptual proofs); the RG reading is exact there, not merely
    suggestive.
  evidence: [feigenbaum-1978]

- from: optimization
  to: computational-imaging
  type: APPLIED-IN
  strength: theorem
  context: >-
    Modern reconstruction is variational: penalized-likelihood and
    compressed-sensing programs (TV, ℓ₁) replace inverse formulas for
    noisy, incomplete data, with exact-recovery theorems (RIP,
    incoherence) grading the idealized claims.
  evidence: [candes-etal-2006]

- from: bayes-rule
  to: computational-imaging
  type: APPLIED-IN
  strength: theorem
  context: >-
    Bayesian inversion: priors regularize the ill-posedness (MAP with
    Gaussian noise and a quadratic prior is exactly Tikhonov), and the
    posterior quantifies the uncertainty an inverse formula pretends away.
  evidence: [kaipio-somersalo-2005]

- from: conservation-laws
  to: graph-laplacian
  type: SAME-SKELETON
  strength: strong-analogy
  context: >-
    Kirchhoff's current law is the continuity equation discretized to a
    network: flow conservation at every node, with the Laplacian factoring
    through the incidence matrix (L = BᵀWB) as div∘grad — the same
    balance skeleton the continuum writes with ∇·.
  evidence: [chung-1997]

- from: diffusion
  to: large-number-limits
  type: ASSUMES
  strength: theorem
  context: >-
    The diffusion reading of a microscopic process assumes the scaling
    regime: many small, weakly dependent increments with finite variance
    in the window observed — Donsker's invariance principle states the
    precise hypotheses.
  notes: >-
    The standing failure modes are the point of recording the assumption:
    heavy-tailed steps or long memory give Lévy flights and anomalous
    diffusion, and the classical heat kernel silently misdescribes both.
  evidence: [billingsley-1999]

- from: dimensional-analysis
  to: symmetry
  type: IS-A
  strength: special-case
  context: >-
    Unit rescalings form a transformation group, and Buckingham Π says
    physical laws are invariant under it — so laws must be functions of
    the group's invariants, the dimensionless products. Dimensional
    analysis is symmetry reasoning for the similarity group.
  evidence: [barenblatt-1996]

- from: stability-margins
  to: feedback-control
  type: ASSUMES
  strength: theorem
  context: >-
    Margins are defined on a loop: a loop transfer function with a
    declared breaking point, read near the Nyquist critical point — no
    loop, no margin — and multivariable loops need disk or structured
    variants before the numbers mean what designers budget.
  evidence: [astrom-murray-2008]

- from: linearization
  to: image-registration
  type: APPLIED-IN
  strength: theorem
  context: >-
    Lucas–Kanade linearizes brightness constancy about the current warp
    each iteration — the optical-flow normal equations are the linearized
    residual's least squares, solved coarse-to-fine (Gauss–Newton on the
    alignment energy).
  evidence: [lucas-kanade-1981]

- from: state-space-model
  to: integral-transforms
  type: REPRESENTED-BY
  strength: theorem
  context: >-
    LTI realizations become rational transfer functions under the
    Laplace/z transform (C(sI − A)⁻¹B + D), and realization theory runs
    the other way, with minimal ↔ controllable-and-observable (Kalman) —
    the bridge feedback design crosses freely.
  notes: >-
    Scoped to linear time-invariant models: time-varying and nonlinear
    state-space models leave the transform picture.
  evidence: [kailath-1980]

- from: linearization
  to: chaos
  type: FAILS-WHEN
  strength: theorem
  context: >-
    Chaos is global: trajectories leave every neighborhood where one
    Jacobian speaks, and no single linearization's spectrum can certify or
    exclude it — limit cycles far from equilibria and strange attractors
    are invisible to the move by construction.
  evidence: [strogatz-1994]

- from: state-space-model
  to: markov-chains
  type: ASSUMES
  strength: theorem
  context: >-
    The state process is Markov — given the present state, the future is
    independent of the past — which is the structural condition that makes
    recursive prediction–correction possible; the mirror of the same
    assumption typed on the hidden-Markov side.
  evidence: [anderson-moore-1979]

- from: kalman-filter
  to: optimization
  type: REPRESENTED-BY
  strength: theorem
  context: >-
    The filter is recursive least squares: the minimum-variance / MAP
    estimate of a linear-Gaussian state is a quadratic program the
    recursion solves exactly, and estimation–control (LQE/LQR) duality
    runs the same Riccati equation both ways.
  evidence: [anderson-moore-1979]

- from: shannon-entropy
  to: optimization
  type: REPRESENTED-BY
  strength: theorem
  context: >-
    Maximum entropy is convex duality in exact form: entropy maximization
    under moment constraints has Lagrange multipliers that become the
    natural parameters of the exponential family, and the dual problem is
    maximum likelihood in that family.
  evidence: [cover-thomas-2006, boyd-vandenberghe-2004]

- from: stability
  to: phase-space
  type: REPRESENTED-BY
  strength: theorem
  context: >-
    Stability's definitions are portrait geometry: Lyapunov stability and
    attraction are neighborhood statements about the flow, basins bound
    how far the local verdict reaches, and Lyapunov functions turn "energy
    decreases" into invariant level-set geometry — the direct method needs
    no linearization at all.
  evidence: [khalil-2002]

- from: markov-chains
  to: protein-folding
  type: APPLIED-IN
  strength: strong-analogy
  context: >-
    Markov state models are Markov chains on conformational macrostates:
    transition probabilities estimated at a lag time, with folding rates
    and pathways read from the chain's spectrum — the slowest relaxation
    is folding itself.
  notes: >-
    Markovianity after coarse-graining is validated per system (implied
    timescales); the hidden-Markov edge carries the refinement that
    corrects imperfect state discretization. Together they type the
    MSM story the M13 inventory routed through edges, not nodes.
  evidence: [prinz-etal-2011]

- from: shannon-entropy
  to: markov-chains
  type: APPLIED-IN
  strength: theorem
  context: >-
    Entropy rate has closed form for a stationary chain
    (−Σᵢ πᵢ Pᵢⱼ log Pᵢⱼ), and the asymptotic equipartition property
    extends to ergodic Markov sources (Shannon–McMillan–Breiman) — typical
    sequences and compression limits, exactly.
  evidence: [cover-thomas-2006]

- from: smoothness
  to: large-number-limits
  type: FAILS-WHEN
  strength: theorem
  context: >-
    Phase transitions: free energies of finite systems are analytic, and
    the nonanalyticity that defines a transition emerges only in the
    thermodynamic limit — regularity assumptions about collective
    observables break exactly where the large-number limit creates the
    kink.
  evidence: [goldenfeld-1992]

- from: smoothness
  to: renormalization
  type: REPLACED-BY
  strength: strong-analogy
  context: >-
    At critical points the analytic (Landau/mean-field) description gives
    way to scaling: exponents, data collapse, and RG flow replace Taylor
    expansion of the free energy — the replacement rung for nonsmoothness
    that emerges collectively rather than pointwise.
  evidence: [goldenfeld-1992]

- from: smoothness
  to: variational-principles
  type: REPLACED-BY
  strength: theorem
  context: >-
    When classical derivatives fail — shocks, corners, rough coefficients
    — the variational statement survives: weak solutions are stationarity
    conditions in integral form, existence comes from the direct method,
    and the classical PDE is recovered exactly where regularity returns.
  evidence: [evans-2010]

- from: vector-calculus
  to: smoothness
  type: ASSUMES
  strength: theorem
  context: >-
    The differential probes (gradient, divergence, curl, Laplacian) need
    differentiability of the fields they probe; at shocks and interfaces
    the local statements hand over to the integral/weak forms, which is
    the local–global duality doing rescue work.
  evidence: [evans-2010]

- from: bayes-rule
  to: weather-prediction
  type: APPLIED-IN
  strength: theorem
  context: >-
    Assimilation is posterior inference: 3D/4D-Var cost functions are
    negative log posteriors under Gaussian error models, the EnKF samples
    the same update, and the Bayesian formulation is what licenses
    extensions beyond the linear-Gaussian idealization (particle DA).
  evidence: [wikle-berliner-2007, kalnay-2003]

- from: state-space-model
  to: weather-prediction
  type: APPLIED-IN
  strength: theorem
  context: >-
    The assimilation cycle is state estimation on an explicit state-space
    model: forecast dynamics propagate the state, observation operators
    map it to measurements, the analysis corrects it — the structure that
    makes "forecast, then update" well-posed at a billion state variables.
  evidence: [kalnay-2003]

