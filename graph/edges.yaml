# The ergodic theorem, stated (M16; issue #32). The graph leaned on ergodic
# reasoning in three edge contexts without stating the theorem; these two
# edges and the large-number-limits fifth row land it. The
# thermodynamic-entropy edge also resolves that pair's standing
