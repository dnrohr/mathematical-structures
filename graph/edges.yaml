- from: large-number-limits
  to: chaos
  type: GOVERNS
  strength: theorem
  context: >-
    Birkhoff's pointwise ergodic theorem: for an ergodic invariant
    measure, time averages along almost every trajectory equal the space
    average — the law of large numbers with a single trajectory as the
    sample, which is what gives chaotic dynamics statistics where
    individual paths are hopeless.
  notes: >-
    Theorem-grade under its stated hypotheses (a measure-preserving system
    with an ergodic invariant measure, integrable observable). Which
    physical attractors carry such measures (SRB) and whether observations
    sample them is where honesty about real systems lives; mixing, not
    ergodicity alone, is what buys convergence rates.
  evidence: [birkhoff-1931, walters-1982]

- from: large-number-limits
  to: thermodynamic-entropy
  type: GOVERNS
  strength: strong-analogy
  context: >-
    The ergodic hypothesis: laboratories measure time averages, ensembles
    compute phase-space averages, and equating the two — Birkhoff's
    equality assumed to apply to the physical system on the timescales
    observed — is what earns equilibrium ensemble entropy its
    thermodynamic reading for a single system.
  notes: >-
    Deliberately strong-analogy, read aloud at landing (issue #32): inside
    an ergodic measure-preserving model the equality is Birkhoff's
    theorem; that a real many-body system is ergodic over observation
    times is a hypothesis with standing failure modes — metastability
    (glasses, magnetized domains), broken ergodicity after symmetry
    breaking, integrable dynamics confined to invariant tori — and the
    observables must self-average for the equality to matter.
  evidence: [birkhoff-1931, walters-1982]

