<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Structure Atlas</title>
    <meta
      name="description"
      content="An interactive field guide to the mathematical structures that recur across science."
    />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Cpath d='M4.5 11.5 11.5 4.5M11.5 11.5 11.5 4.5M4.5 11.5 11.5 11.5' stroke='%23848a90' stroke-width='1.3'/%3E%3Ccircle cx='4.5' cy='11.5' r='2.4' fill='%233f6fa8'/%3E%3Ccircle cx='11.5' cy='4.5' r='2.4' fill='%23a06e1f'/%3E%3Ccircle cx='11.5' cy='11.5' r='2.4' fill='%2321857a'/%3E%3C/svg%3E"
    />
    <script>
      // Apply a manual theme override before first paint to avoid a flash;
      // without a stored override, CSS follows prefers-color-scheme.
      try {
        var t = localStorage.getItem('atlas-theme');
        if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t;
      } catch (e) {
        /* storage unavailable: stay on the media-query default */
      }
    </script>
    <script type="module" src="/src/main.ts"></script>
  </head>
  <body>
    <div id="app">
      <noscript>
        The Structure Atlas reader is a client-side app over <code>graph.json</code> and needs
        JavaScript. The dataset itself is plain files — see the repository.
      </noscript>
      <p class="boot">Loading the atlas…</p>
    </div>
  </body>
</html>
